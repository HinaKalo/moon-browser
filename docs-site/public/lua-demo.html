<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工单聚焦视图 · Moon Browser Lua 演示</title>
<style>
  body { margin: 0; color: #19213c; background: #f4f6fb; font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 40rem; margin: clamp(2rem, 10vw, 6rem) auto; padding: 0 1.5rem; }
  h1 { line-height: 1.2; font-size: clamp(2rem, 6vw, 3rem); }
  #lua-status { border-left: .3rem solid #626c87; padding: .8rem 1rem; background: white; font-weight: 650; }
  #lua-status.success { border-color: #178157; color: #11623f; }
  #demo-banner { margin: 1.2rem 0; padding: .8rem 1rem; border: 1px solid #e2c782; background: #fff5d9; }

  <h1>工单聚焦视图</h1>
  <p>这是一组示例工单。Lua 脚本会记住你的筛选偏好，并在每次打开这页时自动应用。</p>
