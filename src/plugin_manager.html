<!doctype html>
<html lang="zh-CN">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理插件 · Moon Browser</title>
<style>
  :root {
    color-scheme: light;
    --page:#f6f7f9; --panel:#ffffff; --surface:#f1f3f6; --line:#e3e6eb;
    --text:#14161b; --muted:#5b6270; --accent:#5b4df0; --soft:#edebfd;
    font:14px/1.5 "Microsoft YaHei UI","Segoe UI",sans-serif;
    color:var(--text); background:var(--page);
  }
  :root[data-moon-theme=dark] {
    color-scheme:dark;
    --page:#0e0f13; --panel:#181a20; --surface:#20232b; --line:#262932;
    --text:#eceef3; --muted:#9aa0ae; --accent:#7c6cff; --soft:#262244;
  }
  *,*::before,*::after { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; }
  main { max-width:1030px; padding:28px clamp(16px,4vw,38px) 36px; margin:auto; }
  h1,h2,h3,p { margin:0; }
  h1 { font-size:clamp(24px,4vw,32px); letter-spacing:-.045em; }
  h2 { font-size:21px; overflow-wrap:anywhere; }
  h3 { font-size:15px; }
  .heading,.toolbar,.switch-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .counter,#status,.id,.hint { color:var(--muted); }
  .counter { margin-top:4px; }
  .toolbar { margin:20px 0 12px; flex-wrap:wrap; }
  .filters { display:flex; gap:3px; background:var(--surface); border:1px solid var(--line); padding:3px; border-radius:9px; }
  button,input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:disabled { opacity:.56; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .action,input[type=search] { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 11px; }
  .action:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  input[type=search] { min-width:min(100%,210px); flex:1; max-width:340px; }
  .filter { background:transparent; border:1px solid transparent; border-radius:6px; min-height:30px; padding:3px 10px; white-space:nowrap; }
  .filter[aria-pressed=true] { color:var(--accent); background:var(--panel); border-color:var(--line); }
  #status { min-height:21px; margin:0 0 8px; }
  .workspace { display:grid; grid-template-columns:minmax(175px, .65fr) minmax(0, 1fr); gap:12px; align-items:start; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; min-width:0; }
  #list { display:grid; gap:3px; max-height:clamp(250px, 58vh, 640px); padding:6px; overflow:auto; }
  #list:empty { display:none; }
  .plugin { display:grid; grid-template-columns:28px minmax(0,1fr); align-items:center; gap:8px; width:100%; text-align:left; background:transparent; border:1px solid transparent; border-radius:7px; padding:8px; }
  .plugin:hover { background:var(--surface); }
  .plugin[aria-pressed=true] { background:var(--soft); color:var(--accent); }
  .plugin strong { display:block; overflow-wrap:anywhere; line-height:1.35; font-weight:600; }
  .plugin small { display:block; color:var(--muted); margin-top:2px; }
  .mark { width:27px; height:27px; display:grid; place-items:center; background:var(--surface); border-radius:7px; color:var(--accent); }
  .mark::before { content:""; width:10px; height:10px; border:1.5px solid currentColor; border-radius:3px; }
  [data-bundled=true] .mark::before { background:currentColor; border-radius:50%; }
  #details { padding:16px clamp(12px,2.5vw,22px); }
  .details-head { padding-bottom:14px; }
  .id { font:12px/1.5 Consolas,monospace; margin-top:3px; overflow-wrap:anywhere; }
  .section { border-top:1px solid var(--line); padding:12px 0; }
  .section:last-child { padding-bottom:1px; }
  .section h3 { margin-bottom:6px; }
  .hint { font-size:13px; }
  .switch-row { min-height:38px; }
  .switch-row label { cursor:pointer; }
  input[type=checkbox] { flex:none; width:17px; height:17px; margin:0 2px 0 0; accent-color:var(--accent); }
  .command { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:5px 8px; padding:4px 0; }
  .command-actions,.shortcut-actions { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .command-actions .action { font-size:12px; padding:3px 7px; }
  .command-actions .action[aria-pressed=true] { background:var(--soft); border-color:var(--accent); color:var(--accent); }
  .shortcut-editor { margin:4px 0 8px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  .shortcut-editor .hint { margin-bottom:7px; }
  .shortcut-editor [role=status] { margin-top:6px; color:var(--accent); }
  kbd { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:1px 5px; color:var(--muted); white-space:nowrap; }
  #empty { padding:22px; }
  @media(max-width:550px) {
    .workspace { grid-template-columns:1fr; }
    #list { max-height:200px; }
    input[type=search] { max-width:none; }
  }
</style>
<main>
  <header class="heading">
    <div><h1>管理插件</h1><p id="counts" class="counter"></p></div>
    <button class="action" id="market" type="button">插件市场</button>
  </header>
  <div class="toolbar">
    <input type="search" id="search" aria-label="搜索已安装插件" placeholder="按名称或插件 ID 搜索">
    <div class="filters" role="group" aria-label="按安装来源筛选">
      <button class="filter" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter" type="button" data-filter="bundled" aria-pressed="false">内置</button>
      <button class="filter" type="button" data-filter="local" aria-pressed="false">本地</button>
    </div>
  </div>
  <p id="status" role="status">正在读取插件列表…</p>
  <div class="workspace">
    <nav id="list" class="panel" aria-label="已安装插件"></nav>
    <section id="details" class="panel" aria-label="插件详细信息" hidden></section>
  </div>
  <p id="empty" class="panel" hidden></p>
</main>
<script>
  const get = id => document.getElementById(id);
  const search = get('search'), list = get('list'), details = get('details'), status = get('status'), empty = get('empty');
  const sources = { bundled:'内置', local:'本地' };
  const filters = [...document.querySelectorAll('[data-filter]')];
  const cancelled = { enable:'已取消启用。', grant:'已取消授权。' };
  let items = [], selected, source = 'all', busy = false, loading = false, generation = 0;
  let shortcutEditor;

  function make(tag, text, css) {
    const node = document.createElement(tag);
    if (text) node.textContent = text;
    if (css) node.className = css;
    return node;
  }

  async function host(request) {
    const response = JSON.parse(await window.webkit.messageHandlers.moonPlugins.postMessage(JSON.stringify(request)));
    if (response.ok === false) throw Error('UNAVAILABLE');
    return response;
  }

  async function apply(plugin, fields, control) {
    if (busy) return;
    busy = true;
    control.disabled = true;
    try {
      const response = await host({id:plugin.id, ...fields});
      if (fields.op === 'settings') {
        if (!response.opened) throw Error('UNAVAILABLE');
        return;
      }
      if (response.result === 'unavailable') throw Error('UNAVAILABLE');
      if (response.result === 'limitReached') {
        status.textContent = '主菜单固定项已达上限。';
      } else if (fields.op === 'menuPin') {
        status.textContent = fields.enabled ? '已固定到右上角主菜单。' : '已从主菜单移出。';
      } else {
        status.textContent = response.result === 'cancelled' ? cancelled[fields.op] : '已保存。';
      }
    } catch {
      status.textContent = '操作未完成。请重试。';
    } finally {
      control.disabled = false;
      busy = false;
      if (fields.op !== 'settings') await refresh(control.id);
    }
  }

  function checkbox(area, label, id, checked, available, change) {
    const row = make('div', '', 'switch-row');
    const title = make('label', label);
    title.htmlFor = id;
    const input = make('input');
    input.type = 'checkbox';
    input.id = id;
    input.checked = checked;
    input.disabled = !available;
    input.onchange = () => {
      const next = input.checked;
      input.checked = checked;
      change(next, input);
    };
    row.append(title, input);
    area.append(row);
  }

  function editShortcut(plugin, command, row, trigger) {
    shortcutEditor?.close();
    const editor = make('div', '', 'shortcut-editor');
    const hint = make('p', '使用 Ctrl+Shift 或 Alt+Shift，再加一个字母或数字。', 'hint');
    const actions = make('div', '', 'shortcut-actions');
    const record = make('button', '录制快捷键', 'action');
    const save = make('button', '保存', 'action');
    const cancel = make('button', '取消', 'action');
    const feedback = make('p');
    feedback.setAttribute('role', 'status');
    save.disabled = true;
    actions.append(record, save, cancel);
    if (command.custom) {
      const reset = make('button', '恢复原快捷键', 'action');
      reset.onclick = () => submit(null);
      actions.append(reset);
    }
    editor.append(hint, actions, feedback);
    row.after(editor);
    trigger.setAttribute('aria-expanded', 'true');

    let draft, timer, recording = false;
    function stopRecording() {
      if (!recording) return;
      recording = false;
      clearTimeout(timer);
      record.textContent = draft || '录制快捷键';
      host({op:'capture', enabled:false}).catch(() => {});
    }
    const session = {
      captured(chord) {
        if (!recording) return;
        if (chord) draft = chord;
        stopRecording();
        save.disabled = !draft;
        feedback.textContent = chord ? '录制完成，点击保存应用。' : '已结束录制。';
      },
      close() {
        stopRecording();
        editor.remove();
        trigger.setAttribute('aria-expanded', 'false');
        if (shortcutEditor === session) shortcutEditor = null;
      }
    };
    shortcutEditor = session;
    record.onclick = async () => {
      if (recording) { stopRecording(); return; }
      record.focus();
      recording = true;
      record.textContent = '按下组合键…';
      feedback.textContent = '';
      try {
        await host({op:'capture', enabled:true});
        if (recording) timer = setTimeout(() => session.captured(null), 10000);
      } catch {
        stopRecording();
        feedback.textContent = '无法开始录制。';
      }
    };
    record.onblur = stopRecording;
    save.onclick = () => { if (draft) submit(draft); };
    cancel.onclick = () => { session.close(); trigger.focus(); };
    record.focus();

    async function submit(shortcut) {
      if (busy) return;
      busy = true;
      stopRecording();
      try {
        const {result} = await host({op:'shortcut', id:plugin.id, command:command.id, shortcut});
        if (result !== 'saved') {
          feedback.textContent = ({
            reserved:'这是浏览器保留的快捷键，请换一个。',
            conflict:'该组合键已被其他命令占用，请换一个。',
            invalidShortcut:'组合键格式无效。'
          })[result] || '快捷键未保存。请重试。';
          return;
        }
        status.textContent = shortcut ? '快捷键已保存。' : '已恢复原快捷键。';
        if (shortcutEditor === session) {
          session.close();
          await showDetails(plugin, trigger.id);
        }
      } catch {
        feedback.textContent = '快捷键未保存。请重试。';
      } finally {
        busy = false;
      }
    }
  }

  window.addEventListener('moon-shortcut', event => shortcutEditor?.captured(event.detail));

  async function showDetails(plugin, focus) {
    const seq = ++generation;
    shortcutEditor?.close();
    details.hidden = !plugin;
    details.replaceChildren();
    if (!plugin) return;
    try {
      const data = await host({op:'details', id:plugin.id});
      if (seq !== generation) return;
      const heading = make('div', '', 'details-head');
      heading.append(make('h2', plugin.name), make('p', plugin.id, 'id'));
      details.append(heading);
      const general = make('div', '', 'section');
      checkbox(general, '启用插件', 'enable', data.enabled, true,
        (enabled, control) => apply(plugin, {op:'enable', enabled}, control));
      if (data.settings) {
        const button = make('button', '打开设置页面', 'action');
        button.id = 'open-settings';
        button.type = 'button';
        button.disabled = !data.enabled;
        button.onclick = () => apply(plugin, {op:'settings'}, button);
        general.append(button);
      }
      details.append(general);
      const permissions = make('div', '', 'section');
      permissions.append(make('h3', '权限'));
      if (!data.permissions.length) permissions.append(make('p', '此插件未请求权限。', 'hint'));
      if (!data.enabled && data.permissions.length) permissions.append(make('p', '启用插件后可调整权限。', 'hint'));
      for (const permission of data.permissions) {
        checkbox(permissions, permission.label, 'permission-' + permission.id, permission.granted, data.enabled,
          (enabled, control) => apply(plugin, {op:'grant', permission:permission.id, enabled}, control));
      }
      details.append(permissions);
      const commands = make('div', '', 'section');
      commands.append(make('h3', '命令与快捷键'));
      for (const command of data.commands) {
        const row = make('div', '', 'command');
        row.append(make('span', command.label));
        const tools = make('div', '', 'command-actions');
        if (command.shortcut) tools.append(make('kbd', command.shortcut));
        if (command.globalShortcut) tools.append(make('kbd', '全局 ' + command.globalShortcut));
        if (command.linkMenu) tools.append(make('small', '链接右键菜单'));
        if (command.tabDrop) tools.append(make('small', '标签排序'));
        if (data.enabled && !command.linkMenu && !command.tabDrop) {
          const pinBtn = make('button', command.menuPinned ? '移出主菜单' : '固定到主菜单', 'action');
          pinBtn.id = 'menu-pin-' + command.id;
          pinBtn.type = 'button';
          pinBtn.setAttribute('aria-pressed', String(Boolean(command.menuPinned)));
          pinBtn.setAttribute('aria-label', (command.menuPinned ? '从主菜单移出「' : '固定「') + command.label + (command.menuPinned ? '」' : '」到主菜单'));
          pinBtn.onclick = () => apply(plugin, { op:'menuPin', command:command.id, enabled:!command.menuPinned }, pinBtn);
          tools.append(pinBtn);
          const trigger = make('button', command.shortcut ? '修改' : '添加', 'action');
          trigger.id = 'shortcut-' + command.id;
          trigger.setAttribute('aria-label', '设置「' + command.label + '」的浏览器快捷键');
          trigger.setAttribute('aria-expanded', 'false');
          trigger.onclick = () => {
            if (trigger.getAttribute('aria-expanded') === 'true') { shortcutEditor?.close(); return; }
            editShortcut(plugin, command, row, trigger);
          };
          tools.append(trigger);
        }
        row.append(tools);
        commands.append(row);
      }
      details.append(commands);
      if (focus && (document.activeElement === document.body || document.activeElement.id === focus)) get(focus)?.focus();
    } catch {
      if (seq === generation) details.append(make('p','暂时无法读取插件详情。','hint'));
    }
  }

  function render(focus) {
    const query = search.value.trim().toLowerCase();
    const visible = items.filter(item => (source === 'all' || item.bundled === (source === 'bundled')) &&
      (item.name.toLowerCase().includes(query) || item.id.toLowerCase().includes(query)));
    if (!visible.some(item => item.id === selected)) selected = visible[0]?.id;
    const old = list.querySelector(':focus');
    list.replaceChildren();
    for (const item of visible) {
      const row = make('button', '', 'plugin');
      row.type = 'button';
      row.dataset.id = item.id;
      row.dataset.bundled = item.bundled;
      row.setAttribute('aria-pressed', String(item.id === selected));
      const mark = make('span', '', 'mark');
      mark.setAttribute('aria-hidden', 'true');
      const body = make('span');
      body.append(make('strong', item.name), make('small', (item.bundled ? sources.bundled : sources.local) +
        ' · ' + (item.enabled ? '已启用' : '已停用')));
      row.append(mark, body);
      row.onclick = () => {
        selected = item.id;
        for (const child of list.children) child.setAttribute('aria-pressed', String(child === row));
        showDetails(item);
      };
      list.append(row);
      if (old?.dataset.id === item.id) row.focus();
    }
    empty.hidden = visible.length !== 0;
    if (!query && source === 'local') empty.textContent = '当前没有本地安装的插件。';
    else empty.textContent = items.length ? '没有匹配的插件。' : '当前没有已安装的插件。';
    return showDetails(visible.find(item => item.id === selected), focus);
  }

  async function refresh(focus) {
    if (loading || busy) return;
    loading = true;
    try {
      const found = [];
      let offset = 0, limit;
      do {
        const page = await host({op:'list', offset});
        found.push(...page.items);
        offset = page.next;
        limit = page.limit;
      } while (offset !== null);
      items = found.sort((a,b) => a.name.localeCompare(b.name,'zh-CN') || a.id.localeCompare(b.id));
      get('counts').textContent = items.length + ' / ' + limit + ' 个已加载 · ' + items.filter(item => item.enabled).length + ' 个已启用';
      await render(focus);
    } catch {
      status.textContent = '插件列表暂不可用。请按 F5 重试。';
    } finally {
      loading = false;
    }
  }

  search.oninput = () => render();
  for (const button of filters) button.onclick = () => {
    source = button.dataset.filter;
    for (const filter of filters) filter.setAttribute('aria-pressed', String(filter === button));
    render();
  };
  get('market').onclick = async () => {
    try {
      if (!(await host({op:'market'})).opened) throw Error('UNAVAILABLE');
    } catch {
      status.textContent = '暂时无法打开插件市场。';
    }
  };
  window.addEventListener('focus', () => { if (items.length && !details.contains(document.activeElement)) refresh(); });
  status.textContent = '';
  refresh();
</script>
</html>
