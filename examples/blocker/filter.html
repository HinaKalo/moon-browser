<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>严格去广告</title>
<style>
  :root {
    color-scheme: light;
    font: 15px/1.55 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    --page: #f6f7fa;
    --surface: #fff;
    --line: #dadfec;
    --text: #171b27;
    --quiet: #535d73;
    --accent: #4158bf;
    color: var(--text);
    background: var(--page);
  }
  :root[data-moon-theme="dark"] {
    color-scheme: dark;
    --page: #171a22;
    --surface: #222634;
    --line: #39435a;
    --text: #eef1f8;
    --quiet: #b8c1d5;
    --accent: #aab8ff;
  }
  body { margin: 0; }
  main { max-width: 680px; margin: auto; padding: 44px clamp(20px,5vw,44px); }
  h1 { margin: 0 0 4px; font-size: 30px; }
  h2 { margin: 0; font-size: 17px; }
  p { margin: 8px 0 17px; }
  p, #feedback { color: var(--quiet); }
  section { margin-top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; }
  input, button { background: var(--surface); color: inherit; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; }
  input { flex: 1; min-width: 150px; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul { margin: 16px 0 0; padding: 0; list-style: none; }
  li { border-top: 1px solid var(--line); padding: 10px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; overflow-wrap: anywhere; }
  #feedback { margin-bottom: 0; }
</style>
<main>
  <h1>严格去广告</h1>
  <p id="state">正在读取过滤状态…</p>
  <section>
    <h2>暂停过滤的站点</h2>
    <p>如果页面因拦截无法正常使用，可以按域名暂停。子域名同时生效，刷新网页即可应用。</p>
    <div id="controls">
      <input id="site" aria-label="站点域名" placeholder="example.com" autocomplete="off" maxlength="253" spellcheck="false" disabled>
      <button id="pause" disabled>暂停此站点</button>
    </div>
    <ul id="exceptions" hidden></ul>
    <p id="feedback" role="status"></p>
  </section>
</main>
<script>
  const state = document.getElementById('state');
  const site = document.getElementById('site');
  const pause = document.getElementById('pause');
  const exceptions = document.getElementById('exceptions');
  const feedback = document.getElementById('feedback');
  let sequence = 0;
  async function host(method, params = {}) {
    const id = String(++sequence);
    const message = await window.webkit.messageHandlers.moonHost.postMessage(JSON.stringify({ jsonrpc: '2.0', id, method, params }));
    const reply = JSON.parse(message);
    if (reply.id !== id) throw new Error('INVALID_RESPONSE');
    if (reply.error) throw new Error(reply.error.message);
    return reply.result;
  }
  async function render() {
    try {
      const result = await host('network.filter.status');
      state.textContent = result.active ? '已启用。WebKit 在加载匹配资源前执行拦截。'
        : result.preferred ? '过滤尚未生效。请检查规则文件和内核。' : '其他插件正在管理网页过滤。';
      pause.disabled = site.disabled = !result.preferred;
      exceptions.replaceChildren();
      exceptions.hidden = result.exceptions.length === 0;
      for (const hostName of result.exceptions) {
        const item = document.createElement('li');
        const name = document.createElement('span');
        name.textContent = hostName;
        const resume = document.createElement('button');
        resume.textContent = '恢复过滤';
        resume.setAttribute('aria-label', '恢复过滤 ' + hostName);
        resume.disabled = !result.preferred;
        resume.onclick = () => setSite(hostName, true);
        item.append(name, resume);
        exceptions.append(item);
      }
    } catch {
      state.textContent = '请在插件菜单启用严格去广告并授予网页请求拦截权限。';
      pause.disabled = site.disabled = true;
    }
  }
  async function setSite(hostName, enabled) {
    try {
      await host('network.filter.setSite', { host: hostName, enabled });
      site.value = '';
      feedback.textContent = enabled ? '已恢复过滤。' : '已暂停过滤。';
      await render();
      site.focus();
    } catch (error) {
      feedback.textContent = error.message === 'INVALID_PARAMS' ? '请输入域名，例如 example.com。'
        : error.message === 'LIMIT_EXCEEDED' ? '暂停列表已满。' : '无法保存站点设置。';
    }
  }
  pause.onclick = () => setSite(site.value, false);
  site.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.isComposing) setSite(site.value, false);
  });
  render();
</script>
</html>
