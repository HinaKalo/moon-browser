<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书签</title>
<style>
  :root { color-scheme: light; font: 14px/1.55 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif; --page:#f6f7fa; --surface:#fff; --text:#171b26; --muted:#535e74; --line:#dbe0ed; --accent:#4158bf; --soft:#edf0fc; background:var(--page); color:var(--text); }
  :root[data-moon-theme=dark] { color-scheme:dark; --page:#171a22; --surface:#222635; --text:#edf0f7; --muted:#b6c0d5; --line:#3a435b; --accent:#acbbff; --soft:#303852; }
  * { box-sizing:border-box; }
  body { margin:0; }
  main { max-width:900px; margin:auto; padding:42px clamp(20px,5vw,48px); }
  h1 { margin:0 0 20px; font-size:30px; }
  h2 { margin:0 0 12px; font-size:19px; }
  .toolbar,.actions,li { display:flex; align-items:center; gap:8px; }
  .toolbar { flex-wrap:wrap; }
  .toolbar input { min-width:min(210px,100%); }
  #folder-path,#folders,#selection { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:13px; }
  #folders[hidden],#selection[hidden] { display:none; }
  #folder-path button[aria-current=location] { background:var(--soft); }
  #folder-status,#selection-count,#move-description,#move-error { color:var(--muted); }
  #folder-status:empty,#selection-count:empty,#move-error:empty { display:none; }
  #remove-selected,#remove-confirm { color:#a52937; }
  :root[data-moon-theme=dark] #remove-selected,:root[data-moon-theme=dark] #remove-confirm { color:#ffadb6; }
  #remove-error:empty,#open-error:empty { display:none; }
  input,button { font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 11px; }
  input { min-width:0; flex:1; }
  button { cursor:pointer; }
  button:hover { background:var(--soft); }
  button:disabled { opacity:.5; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #status,#edit-error,small { color:var(--muted); }
  #status:empty,#edit-error:empty,#transfer-status:empty { display:none; }
  ul { padding:0; margin:18px 0 0; list-style:none; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
  li { padding:0 10px 0 2px; }
  li + li { border-top:1px solid var(--line); }
  a { flex:1; min-width:0; text-decoration:none; color:inherit; padding:10px 12px; border-radius:8px; }
  a:hover { background:var(--soft); }
  a strong,a small { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder { display:inline-block; color:var(--muted); background:var(--soft); border-radius:6px; padding:1px 6px; margin-left:7px; font-weight:400; }
  li button { border-color:transparent; }
  li input { flex:none; margin:0 0 0 11px; width:17px; height:17px; accent-color:var(--accent); }
  #more { margin-top:14px; }
  dialog { width:min(450px,calc(100% - 32px)); color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px; }
  dialog::backdrop { background:#161a3360; }
  label { display:grid; gap:4px; margin:10px 0; }
  .actions { justify-content:flex-end; margin-top:15px; flex-wrap:wrap; }
</style>
<main>
  <h1>书签</h1>
  <div class="toolbar">
    <input type="search" id="search" placeholder="搜索标题、网址或文件夹" aria-label="搜索书签" maxlength="64">
    <button id="add">新建书签</button>
    <button id="import">导入 HTML</button>
    <button id="export">导出 HTML</button>
  </div>
  <nav id="folder-path" aria-label="书签位置"></nav>
  <div id="folders" aria-label="子文件夹" hidden></div>
  <p id="folder-status" role="status"></p>
  <div id="selection" hidden>
    <button type="button" id="select-displayed">选择已显示书签</button>
    <button type="button" id="open-selected" disabled>在后台打开…</button>
    <button type="button" id="move-selected" disabled>移到文件夹…</button>
    <button type="button" id="remove-selected" disabled>删除所选…</button>
    <span id="selection-count" role="status"></span>
  </div>
  <p id="status" role="status">正在读取书签…</p>
  <p id="transfer-status" role="status"></p>
  <ul id="results" aria-label="书签列表" hidden></ul>
  <button id="more" hidden>加载更多</button>
  <dialog id="editor" aria-labelledby="editor-title">
    <h2 id="editor-title">编辑书签</h2>
    <form id="fields">
      <label>标题<input id="title" maxlength="127" autocomplete="off"></label>
      <label>网址<input id="url" type="url" required maxlength="4095" placeholder="https://example.com"></label>
      <label>文件夹<input id="folder" maxlength="160" placeholder="例如工作 / 项目" autocomplete="off"></label>
      <p id="edit-error" role="alert"></p>
      <div class="actions"><button type="button" id="dismiss">取消</button><button id="save">保存</button></div>
    </form>
  </dialog>
  <dialog id="move-dialog" aria-labelledby="move-title">
    <h2 id="move-title">移到文件夹</h2>
    <form id="move-form">
      <p id="move-description"></p>
      <label>目标文件夹<input id="destination" maxlength="160" placeholder="例如工作 / 项目" autocomplete="off" aria-describedby="destination-help"></label>
      <small id="destination-help">留空移到根目录。可输入新文件夹路径。</small>
      <p id="move-error" role="alert"></p>
      <div class="actions"><button type="button" id="move-cancel">取消</button><button id="move-confirm">移动</button></div>
    </form>
  </dialog>
  <dialog id="open-dialog" aria-labelledby="open-title" aria-describedby="open-description">
    <h2 id="open-title">在后台打开书签</h2>
    <p id="open-description"></p>
    <p id="open-error" role="alert"></p>
    <div class="actions">
      <button type="button" id="open-cancel" autofocus>取消</button>
      <button type="button" id="open-confirm">打开书签</button>
    </div>
  </dialog>
  <dialog id="remove-dialog" aria-labelledby="remove-title" aria-describedby="remove-description">
    <h2 id="remove-title">删除所选书签？</h2>
    <p id="remove-description"></p>
    <p id="remove-error" role="alert"></p>
    <div class="actions">
      <button type="button" id="remove-cancel" autofocus>取消</button>
      <button type="button" id="remove-confirm">删除书签</button>
    </div>
  </dialog>
</main>
<script>
  const el = id => document.getElementById(id);
  const search = el('search'), results = el('results'), status = el('status'), more = el('more'), editor = el('editor');
  const folderPath = el('folder-path'), folders = el('folders'), folderStatus = el('folder-status');
  const selection = el('selection'), moveSelected = el('move-selected'), selectionCount = el('selection-count');
  const selectDisplayed=el('select-displayed'), removeSelected=el('remove-selected'), removeDialog=el('remove-dialog');
  const removeConfirm=el('remove-confirm'), removeCancel=el('remove-cancel');
  const openSelected=el('open-selected'), openDialog=el('open-dialog');
  const openConfirm=el('open-confirm'), openCancel=el('open-cancel'), openError=el('open-error');
  const moveDialog = el('move-dialog'), moveConfirm = el('move-confirm'), moveCancel = el('move-cancel');
  const destination = el('destination');
  const separator = ' / ', selectionLimit = 100;
  const selected = new Set();
  let folder = null, folderCursor = null, folderVersion = 0, loading = false;
  let sequence = 0, revision = 0, timer, cursor, editing;
  async function host(method, params) {
    const id = 'bookmark:' + ++sequence;
    const reply = JSON.parse(await window.webkit.messageHandlers.moonHost.postMessage(JSON.stringify({ jsonrpc:'2.0', id, method, params })));
    if (reply.id !== id || reply.error) throw Error(reply.error?.message || 'INVALID_RESPONSE');
    return reply.result;
  }
  function goFolder(path) {
    folder = path;
    search.value = '';
    search.placeholder = path === null ? '搜索标题、网址或文件夹' : '搜索当前文件夹';
    clearTimeout(timer);
    renderPath();
    load();
    search.focus({ preventScroll:true });
  }
  function pathButton(label, path) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    if (path === folder) button.setAttribute('aria-current','location');
    button.onclick = () => goFolder(path);
    return button;
  }
  function renderPath() {
    folderPath.replaceChildren(pathButton('全部书签',null),pathButton('根目录',''));
    if (!folder) return;
    let prefix = '';
    for (const part of folder.split(separator)) {
      prefix = prefix ? prefix + separator + part : part;
      folderPath.append(pathButton(part,prefix));
    }
  }
  async function loadFolders(append = false) {
    const version = ++folderVersion;
    folderStatus.textContent = '';
    if (!append) folders.replaceChildren();
    el('more-folders')?.remove();
    folders.hidden = !folders.children.length;
    if (folder === null) return;
    try {
      const page = await host('bookmarks.folders',{ parent:folder,after:append ? folderCursor : null });
      if (version !== folderVersion) return;
      for (const name of page.folders) {
        const path = folder ? folder + separator + name : name;
        const button = pathButton(name,path);
        button.dataset.folder = path;
        folders.append(button);
      }
      folderCursor = page.next;
      if (folderCursor !== null) {
        const next = document.createElement('button');
        next.id = 'more-folders';
        next.textContent = '更多文件夹';
        next.onclick = () => loadFolders(true);
        folders.append(next);
      }
      folders.hidden = !folders.children.length;
    } catch {
      if (version === folderVersion) folderStatus.textContent = '无法读取文件夹。';
    }
  }
  const bookmarkChoices=()=>[...results.querySelectorAll('input[data-bookmark]')];
  const selectionFilled=choices=>selected.size===selectionLimit || choices.every(choice=>selected.has(Number(choice.dataset.bookmark)));
  function showSelection() {
    const choices=bookmarkChoices();
    selection.hidden = choices.length===0;
    openSelected.disabled = moveSelected.disabled = removeSelected.disabled = loading || selected.size===0;
    selectDisplayed.disabled=loading;
    selectDisplayed.textContent=selectionFilled(choices) ? '清除选择' : '选择已显示书签';
    selectionCount.textContent = selected.size ? `已选择 ${selected.size} 条` +
      (selected.size===selectionLimit ? '，已达上限' : '') : '';
    for (const choice of choices) {
      choice.checked = selected.has(Number(choice.dataset.bookmark));
      choice.disabled = loading || (!choice.checked && selected.size===selectionLimit);
    }
  }
  selectDisplayed.onclick=()=>{
    const choices=bookmarkChoices();
    if (selectionFilled(choices)) selected.clear();
    else for (const choice of choices) {
      if (selected.size===selectionLimit) break;
      selected.add(Number(choice.dataset.bookmark));
    }
    showSelection();
  };
  function edit(item) {
    editing = item;
    el('editor-title').textContent = item ? '编辑书签' : '新建书签';
    el('title').value = item?.title ?? '';
    el('url').value = item?.url ?? '';
    el('folder').value = item?.folder ?? folder ?? '';
    el('edit-error').textContent = '';
    editor.showModal();
  }
  function append(item) {
    const row = document.createElement('li');
    const choice = document.createElement('input');
    choice.type = 'checkbox';
    choice.dataset.bookmark = item.id;
    choice.setAttribute('aria-label','选择 ' + (item.title || item.url));
    choice.onchange = () => {
      if (choice.checked && selected.size < selectionLimit) selected.add(item.id);
      else selected.delete(item.id);
      showSelection();
    };
    const link = document.createElement('a');
    link.href = item.url;
    const heading = document.createElement('strong');
    heading.textContent = item.title || item.url;
    if (item.folder) {
      const folder = document.createElement('span');
      folder.className = 'folder';
      folder.textContent = item.folder;
      heading.append(folder);
    }
    const address = document.createElement('small');
    address.textContent = item.url;
    link.append(heading,address);
    const change = document.createElement('button');
    change.textContent = '编辑';
    change.setAttribute('aria-label','编辑 ' + (item.title || item.url));
    change.onclick = () => edit(item);
    const remove = document.createElement('button');
    remove.textContent = '删除';
    remove.setAttribute('aria-label','删除 ' + (item.title || item.url));
    remove.onclick = async () => {
      remove.disabled = true;
      try {
        await host('bookmarks.remove',{ id:item.id });
        await load();
        status.textContent = '已删除书签。';
        search.focus();
      } catch { remove.disabled = false; status.textContent = '无法删除书签。'; }
    };
    row.append(choice,link,change,remove);
    results.append(row);
  }
  async function load(appendMore = false) {
    const request = ++revision;
    loading = true;
    if (!appendMore) { selected.clear(); loadFolders(); }
    showSelection();
    more.disabled = true;
    try {
      const query = search.value.trim();
      const page = await host('bookmarks.list',{ query,before:appendMore ? cursor : null,folder });
      if (request !== revision) return;
      if (!appendMore) results.replaceChildren();
      page.bookmarks.forEach(append);
      results.hidden = !results.children.length;
      cursor = page.next;
      more.hidden = cursor === null;
      status.textContent = results.hidden ? (query ? '没有匹配的书签。' : folder!==null ? '这里暂无书签。' : '用 Ctrl+D 保存网页，或新建书签。') : '';
      el('add').disabled = false;
    } catch (error) {
      if (request !== revision) return;
      results.replaceChildren();
      selected.clear();
      results.hidden = more.hidden = true;
      el('add').disabled = true;
      status.textContent = error.message === 'PERMISSION_DENIED' ? '请在插件菜单允许管理书签。' : '无法读取书签。';
    } finally {
      if (request === revision) { more.disabled = loading = false; showSelection(); }
    }
  }
  el('add').onclick = () => edit(null);
  async function transfer(exporting) {
    const buttons = [el('import'),el('export')];
    buttons.forEach(button => { button.disabled = true; });
    const feedback = el('transfer-status');
    feedback.textContent = '';
    try {
      const result = await host(exporting ? 'bookmarks.exportHtml' : 'bookmarks.importHtml',{});
      if (result.state === 'done') {
        if (!exporting) await load();
        feedback.textContent = exporting ? '已导出 ' + result.count + ' 个书签。' :
          '已导入 ' + result.count + ' 个，跳过 ' + result.skipped + ' 个。';
      } else {
        feedback.textContent = ({
          cancelled:'', invalidFile:'请选择有效的 UTF-8 HTML 书签文件，最大 8 MiB。',
          limitExceeded:'超出书签数量、文件大小或文件夹深度上限。',
          unavailable:'无法完成迁移，请检查权限和文件位置。'
        })[result.state];
      }
    } catch {
      feedback.textContent = '请在插件菜单授予导入和导出书签的权限。';
    } finally {
      buttons.forEach(button => { button.disabled = false; });
    }
  }
  el('import').onclick = () => transfer(false);
  el('export').onclick = () => transfer(true);
  el('dismiss').onclick = () => editor.close();
  let movingIds = [];
  moveSelected.onclick = () => {
    movingIds = [...selected];
    el('move-description').textContent = `移动所选的 ${movingIds.length} 条书签。`;
    destination.value = folder ?? '';
    el('move-error').textContent = '';
    moveDialog.showModal();
    destination.select();
  };
  moveCancel.onclick = () => moveDialog.close();
  moveDialog.oncancel = event => { if (moveConfirm.disabled) event.preventDefault(); };
  el('move-form').onsubmit = async event => {
    event.preventDefault();
    moveConfirm.disabled = moveCancel.disabled = true;
    const path = destination.value.trim();
    try {
      const { moved } = await host('bookmarks.move',{ ids:movingIds,folder:path });
      moveDialog.close();
      await load();
      status.textContent = moved ? `已移动 ${moved} 条书签。` : '没有书签需要移动。';
      search.focus();
    } catch (error) {
      el('move-error').textContent = error.message==='INVALID_PARAMS' ? '请检查文件夹路径，最多 160 UTF-8 字节。' : '无法移动所选书签。';
    } finally { moveConfirm.disabled = moveCancel.disabled = false; }
  };
  let openingIds=[];
  openSelected.onclick=()=>{
    openingIds=bookmarkChoices().map(choice=>Number(choice.dataset.bookmark)).filter(id=>selected.has(id));
    el('open-description').textContent=`将打开所选的 ${openingIds.length} 条书签。切换到新标签时才会加载网页。`;
    openError.textContent='';
    openDialog.showModal();
  };
  openCancel.onclick=()=>openDialog.close();
  openDialog.oncancel=event=>{ if (openConfirm.disabled) event.preventDefault(); };
  openConfirm.onclick=async ()=>{
    openConfirm.disabled=openCancel.disabled=true;
    openError.textContent='';
    try {
      const {state,opened,missing}=await host('bookmarks.openMany',{ids:openingIds});
      if (state==='tabLimit') {
        openError.textContent='标签空间不足。关闭部分标签后重试。';
        return;
      }
      if (state==='unavailable') throw Error('UNAVAILABLE');
      openDialog.close();
      selected.clear();
      showSelection();
      status.textContent=opened ? `已在后台打开 ${opened} 个标签。` +
        (missing ? `跳过 ${missing} 条已失效书签。` : '') : '所选书签已失效。';
      search.focus({preventScroll:true});
    } catch {
      openError.textContent='无法打开所选书签。';
    } finally { openConfirm.disabled=openCancel.disabled=false; }
  };
  let removingIds=[];
  removeSelected.onclick=()=>{
    removingIds=[...selected];
    el('remove-description').textContent=`将从书签库删除所选的 ${removingIds.length} 条书签。`;
    el('remove-error').textContent='';
    removeDialog.showModal();
  };
  removeCancel.onclick=()=>removeDialog.close();
  removeDialog.oncancel=event=>{ if (removeConfirm.disabled) event.preventDefault(); };
  removeConfirm.onclick=async ()=>{
    removeConfirm.disabled=removeCancel.disabled=true;
    try {
      const {removed}=await host('bookmarks.removeMany',{ids:removingIds});
      removeDialog.close();
      await load();
      status.textContent=removed ? `已删除 ${removed} 条书签。` : '所选书签已被移除。';
      search.focus();
    } catch {
      el('remove-error').textContent='无法删除所选书签。';
    } finally { removeConfirm.disabled=removeCancel.disabled=false; }
  };
  el('fields').onsubmit = async event => {
    event.preventDefault();
    el('save').disabled = true;
    const entry = { title:el('title').value.trim(), url:el('url').value.trim(), folder:el('folder').value.trim() };
    try {
      if (editing) await host('bookmarks.update',{ ...entry,id:editing.id });
      else if (await host('bookmarks.save',entry) === 'alreadySaved') throw Error('ALREADY_EXISTS');
      editor.close();
      await load();
      search.focus();
    } catch (error) {
      el('edit-error').textContent = error.message === 'ALREADY_EXISTS' ? '这个网址已在书签中。'
        : error.message === 'INVALID_PARAMS' ? '请检查网址和文件夹路径。' : '无法保存书签。';
    } finally { el('save').disabled = false; }
  };
  search.oninput = () => {
    revision++;
    selected.clear();
    loading = more.disabled = true;
    showSelection();
    clearTimeout(timer);
    timer = setTimeout(load,120);
  };
  more.onclick = () => load(true);
  document.addEventListener('visibilitychange',() => { if (!document.hidden) load(); });
  renderPath();
  load();
</script>
</html>
