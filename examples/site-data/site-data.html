<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站点数据</title>
<style>
  :root { color-scheme:light; font:14px/1.55 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif; --page:#f6f7fa; --surface:#fff; --text:#171b26; --muted:#535e74; --line:#dbe0ed; --accent:#4158bf; --soft:#edf0fc; background:var(--page); color:var(--text); }
  :root[data-moon-theme=dark] { color-scheme:dark; --page:#171a22; --surface:#222635; --text:#edf0f7; --muted:#b6c0d5; --line:#3a435b; --accent:#acbbff; --soft:#303852; }
  * { box-sizing:border-box; }
  body { margin:0; }
  main { max-width:960px; margin:auto; padding:42px clamp(20px,5vw,48px); }
  h1 { margin:0; font-size:30px; }
  .heading,.toolbar { display:flex; align-items:center; flex-wrap:wrap; justify-content:space-between; gap:10px; }
  #origin { margin:3px 0 20px; color:var(--muted); overflow-wrap:anywhere; }
  .groups { display:flex; flex-wrap:wrap; gap:6px; }
  input,button,textarea { font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 11px; }
  button { cursor:pointer; }
  button:hover:not(:disabled),button[aria-pressed=true] { background:var(--soft); }
  button[aria-pressed=true] { color:var(--accent); border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .search { min-width:160px; flex:1; max-width:290px; }
  #status,#details { color:var(--muted); }
  #status:empty,#details:empty { display:none; }
  ul { list-style:none; padding:0; margin:16px 0 0; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
  li { padding:12px 14px; }
  li+li { border-top:1px solid var(--line); }
  .entry { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .entry code { font-size:14px; overflow-wrap:anywhere; }
  .caption { color:var(--muted); display:block; margin-top:3px; }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:10px 0 0; background:var(--page); border-radius:6px; padding:9px 11px; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  #editor { margin-top:16px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:9px; }
  #editor-title { margin:0 0 8px; font-size:16px; overflow-wrap:anywhere; }
  #editor textarea { display:block; width:100%; resize:vertical; min-height:90px; font-family:Consolas,monospace; }
  #editor-actions { display:flex; gap:8px; margin-top:10px; }
  #feedback:empty { display:none; }
</style>
<main>
  <div class="heading">
    <h1>站点数据</h1>
    <div><button id="refresh" disabled>刷新</button> <button id="inspector" disabled>打开开发者工具</button></div>
  </div>
  <p id="origin"></p>
  <div class="toolbar">
    <div class="groups" role="group" aria-label="数据类别">
      <button data-group="cookies" aria-pressed="true">Cookie</button>
      <button data-group="local" aria-pressed="false">Local storage</button>
      <button data-group="session" aria-pressed="false">Session storage</button>
    </div>
    <input class="search" id="search" type="search" aria-label="按名称筛选" placeholder="按名称筛选">
  </div>
  <p id="status" role="status">正在连接浏览器…</p>
  <p id="feedback" role="status"></p>
  <form id="editor" aria-labelledby="editor-title" hidden>
    <h2 id="editor-title"></h2>
    <div id="editor-value">
      <label for="new-value" class="caption">存储值</label>
      <textarea id="new-value" spellcheck="false"></textarea>
      <span id="bytes" class="caption"></span>
    </div>
    <div id="editor-actions">
      <button type="submit" id="commit">保存</button>
      <button type="button" id="cancel">取消</button>
    </div>
  </form>
  <ul id="results" aria-label="站点数据条目" hidden></ul>
  <p id="details"></p>
</main>
<script>
  const el = id => document.getElementById(id);
  const status = el('status'), details = el('details'), rows = el('results'), search = el('search');
  const buttons = [...document.querySelectorAll('[data-group]')];
  const editor=el('editor'), feedback=el('feedback'), newValue=el('new-value'), commit=el('commit');
  let seq=0, group='cookies', selected, page, request=0, latest, refreshing=false, writable=false, draft;
  async function host(method,params={}) {
    const id='sites:' + ++seq;
    const reply=JSON.parse(await window.webkit.messageHandlers.moonHost.postMessage(JSON.stringify({jsonrpc:'2.0',id,method,params})));
    if (reply.id !== id || reply.error) throw Error(reply.error?.message || 'INVALID_RESPONSE');
    return reply.result;
  }
  function closeEditor(refocus=false) {
    const previous=draft;
    draft=undefined;
    newValue.value='';
    editor.hidden=true;
    if (refocus && previous?.button.isConnected) previous.button.focus();
  }
  function clear() { rows.replaceChildren(); rows.hidden=true; page=undefined; closeEditor(); }
  function lengthHint() {
    const length=new TextEncoder().encode(newValue.value).length;
    el('bytes').textContent=length + ' / 1024 字节';
    commit.disabled=length>1024;
  }
  async function openEditor(item, button, remove) {
    const current=page;
    const target={group,id:item.id,generation:current.generation};
    let value='';
    if (!remove) {
      try { value=await host('siteData.value',target); }
      catch { feedback.textContent='该条目已过期，请刷新。'; return; }
    }
    if (current!==page || document.hidden || !button.isConnected) return;
    feedback.textContent='';
    el('editor-title').textContent=(remove?'删除条目「':'编辑条目「') + (item.name || '空名称') + '」';
    el('editor-value').hidden=remove;
    commit.textContent=remove?'确认删除':'保存';
    newValue.value=value;
    draft={target,remove,button,initial:newValue.value};
    lengthHint();
    editor.hidden=false;
    (remove ? el('cancel') : newValue).focus();
  }
  newValue.oninput=lengthHint;
  el('cancel').onclick=() => closeEditor(true);
  editor.onsubmit=async event => {
    event.preventDefault();
    if (!draft || commit.disabled) return;
    const {target,remove,initial}=draft;
    if (!remove && newValue.value===initial) {
      closeEditor(true);
      feedback.textContent='没有修改。';
      return;
    }
    commit.disabled=true;
    try {
      await host('siteData.update',{...target,value:remove ? null : newValue.value});
      closeEditor();
      await update();
    } catch {
      closeEditor();
      feedback.textContent='操作未提交，请刷新后重试。';
    }
  };
  function render() {
    rows.replaceChildren();
    if (!page?.available) {
      rows.hidden=true;
      status.textContent='这个网页无法读取所选数据。';
      return;
    }
    const query=search.value.trim().toLocaleLowerCase();
    for (const item of page.entries) {
      if (query && !item.name.toLocaleLowerCase().includes(query)) continue;
      const row=document.createElement('li'), entry=document.createElement('div'), content=document.createElement('div');
      entry.className='entry';
      const name=document.createElement('code'), caption=document.createElement('small'), value=document.createElement('pre');
      name.textContent=item.name || '（空名称）';
      caption.className='caption';
      caption.textContent=item.length + ' 字节' + (item.shortened ? ' · 已截断' : '');
      content.append(name,caption);
      const show=document.createElement('button');
      show.dataset.reveal='';
      show.textContent='显示值';
      show.setAttribute('aria-label','显示 ' + (item.name || '空名称') + ' 的值');
      value.hidden=true;
      show.onclick=async () => {
        if (!value.hidden) { value.textContent=''; value.hidden=true; show.textContent='显示值'; return; }
        const current=page;
        show.disabled=true;
        try {
          const secret=await host('siteData.value',{group,id:item.id,generation:current.generation});
          if (current!==page || !row.isConnected || document.hidden) return;
          value.textContent=secret || '（空值）';
          value.hidden=false;
          show.textContent='隐藏值';
        } catch { status.textContent='该条目已过期。请刷新。'; }
        finally { show.disabled=false; }
      };
      const actions=document.createElement('div');
      actions.className='actions';
      actions.append(show);
      if (writable && group!=='cookies' && !item.shortened) {
        for (const remove of [false,true]) {
          const button=document.createElement('button');
          button.textContent=remove?'删除':'编辑';
          button.setAttribute('aria-label',button.textContent + ' ' + (item.name || '空名称'));
          button.onclick=() => openEditor(item,button,remove);
          actions.append(button);
        }
      }
      entry.append(content,actions);
      row.append(entry,value);
      rows.append(row);
    }
    rows.hidden=rows.children.length===0;
    status.textContent=rows.hidden ? (query ? '没有匹配的条目。' : '暂无数据。') : '';
    details.textContent=(group==='cookies' ? '此处显示网页可读的 Cookie。使用开发者工具可查看 HttpOnly Cookie 及完整属性。' : '') +
      (page.more ? ' 已显示前 32 条。' : '');
  }
  async function load() {
    const ticket=++request;
    try {
      const value=await host('siteData.list',{group});
      if (ticket!==request) return;
      page=value;
      render();
    } catch { if (ticket===request) clear(); }
  }
  const states={
    idle:'请回到要检查的网页，从命令面板选择「查看当前站点数据」。',
    pending:'正在读取站点数据…',
    stale:'原网页已关闭或切换。请在目标网页上重新打开站点数据。',
    expired:'预览已过期，可以刷新获取当前数据。',
    unavailable:'WebKit 暂时无法读取此网页的数据。'
  };
  const messages={
    saved:'已保存。', removed:'已删除。', conflict:'网页已修改此条目，已刷新为当前值。',
    failed:'此网页的存储不可写，修改未保存。'
  };
  async function update() {
    if (refreshing) return;
    refreshing=true;
    try {
      const current=await host('siteData.status');
      writable=current.writable;
      el('origin').textContent=current.origin;
      const unavailable=['idle','stale','pending'].includes(current.state);
      el('refresh').disabled=el('inspector').disabled=unavailable;
      const identity=current.state + ':' + current.generation + ':' + writable;
      if (identity===latest) return;
      latest=identity;
      selected=current.state;
      request++;
      closeEditor();
      feedback.textContent=messages[current.mutation] || '';
      if (selected==='ready') await load();
      else { clear(); details.textContent=''; status.textContent=states[selected] || ''; }
    } catch {
      clear();
      details.textContent='';
      el('refresh').disabled=el('inspector').disabled=true;
      status.textContent='请在插件菜单允许查看站点数据。';
    } finally { refreshing=false; }
  }
  for (const button of buttons) button.onclick=() => {
    group=button.dataset.group;
    for (const other of buttons) other.setAttribute('aria-pressed',String(other===button));
    clear();
    details.textContent='';
    feedback.textContent='';
    if (selected==='ready') load();
  };
  search.oninput=() => { if (page) render(); };
  el('refresh').onclick=async () => {
    try { if (!await host('siteData.refresh')) throw Error(); await update(); }
    catch { status.textContent='无法刷新。请回到目标网页重新打开面板。'; }
  };
  el('inspector').onclick=async () => {
    try { if (!await host('siteData.openInspector')) throw Error(); }
    catch { status.textContent='请检查开发者工具插件是否已启用。'; }
  };
  document.addEventListener('visibilitychange',() => {
    if (document.hidden) {
      closeEditor();
      for (const value of rows.querySelectorAll('pre')) { value.textContent=''; value.hidden=true; }
      for (const button of rows.querySelectorAll('[data-reveal]')) button.textContent='显示值';
    } else { update(); }
  });
  setInterval(() => { if (!document.hidden) update(); },600);
  update();
</script>
</html>
