<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站点数据</title>
<style>
  :root { color-scheme:light; font:14px/1.55 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif; --page:#f6f7fa; --surface:#fff; --text:#171b26; --muted:#535e74; --line:#dbe0ed; --accent:#4158bf; --soft:#edf0fc; background:var(--page); color:var(--text); }
  :root[data-moon-theme=dark] { color-scheme:dark; --page:#171a22; --surface:#222635; --text:#edf0f7; --muted:#b6c0d5; --line:#3a435b; --accent:#acbbff; --soft:#303852; }
  * { box-sizing:border-box; }
  body { margin:0; }
  main { max-width:960px; margin:auto; padding:42px clamp(20px,5vw,48px); }
  h1 { margin:0; font-size:30px; }
  .heading,.toolbar { display:flex; align-items:center; flex-wrap:wrap; justify-content:space-between; gap:10px; }
  #origin { margin:3px 0 20px; color:var(--muted); overflow-wrap:anywhere; }
  .groups { display:flex; flex-wrap:wrap; gap:6px; }
  input,button,textarea { font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 11px; }
  button { cursor:pointer; }
  button:hover:not(:disabled),button[aria-pressed=true] { background:var(--soft); }
  button[aria-pressed=true] { color:var(--accent); border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .search { min-width:160px; flex:1; max-width:290px; }
  #status,#details { color:var(--muted); }
  #status:empty,#details:empty { display:none; }
  ul { list-style:none; padding:0; margin:16px 0 0; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
  li { padding:12px 14px; }
  li+li { border-top:1px solid var(--line); }
  .entry { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .entry code { font-size:14px; overflow-wrap:anywhere; }
  .caption { color:var(--muted); display:block; margin-top:3px; }
  .cookie-meta { overflow-wrap:anywhere; }
  .db-preview { padding:0 12px; margin-top:10px; border:1px solid var(--line); border-radius:8px; background:var(--page); }
  .db-preview p { margin:10px 0; overflow-wrap:anywhere; }
  .db-preview ul { margin:8px 0; border:0; background:none; }
  .db-preview li { padding:8px 0; overflow-wrap:anywhere; }
  .db-preview li li { padding:4px 0 4px 12px; }
  .record-preview { margin:10px 0 2px; overflow:auto; }
  .record-preview table { width:100%; table-layout:fixed; border-collapse:collapse; }
  .record-preview th,.record-preview td { text-align:start; vertical-align:top; padding:6px 8px; border-bottom:1px solid var(--line); }
  .record-preview th:first-child { width:30%; }
  .record-preview pre { margin:0; padding:0; font-size:13px; }
  .record-controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0; }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:10px 0 0; background:var(--page); border-radius:6px; padding:9px 11px; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  #editor { margin-top:16px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:9px; }
  #editor-title { margin:0 0 8px; font-size:16px; overflow-wrap:anywhere; }
  #editor textarea { display:block; width:100%; resize:vertical; min-height:90px; font-family:Consolas,monospace; }
  #editor-key { margin-bottom:9px; }
  #key { width:100%; }
  #editor-actions { display:flex; gap:8px; margin-top:10px; }
  #feedback:empty { display:none; }
  .pager:not([hidden]) { display:flex; justify-content:flex-end; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px; }
  #storage-range { color:var(--muted); }
</style>
<main>
  <div class="heading">
    <h1>站点数据</h1>
    <div><button id="refresh" disabled>刷新</button> <button id="inspector" disabled>打开开发者工具</button></div>
  </div>
  <p id="origin"></p>
  <div class="toolbar">
    <div class="groups" role="group" aria-label="数据类别">
      <button data-group="cookies" aria-pressed="true">Cookie</button>
      <button data-group="local" aria-pressed="false">Local storage</button>
      <button data-group="session" aria-pressed="false">Session storage</button>
      <button data-group="indexedDB" aria-pressed="false">IndexedDB</button>
      <button data-group="cacheStorage" aria-pressed="false">Cache Storage</button>
    </div>
    <input class="search" id="search" type="search" maxlength="128" aria-label="按名称筛选" placeholder="按名称筛选">
    <button id="clear-cookies" hidden>清除站点 Cookie…</button>
    <div id="storage-actions" hidden>
      <button id="create">新增条目</button> <button id="clear-storage">清空此类</button>
    </div>
  </div>
  <p id="status" role="status">正在连接浏览器…</p>
  <p id="feedback" role="status"></p>
  <form id="editor" aria-labelledby="editor-title" hidden>
    <h2 id="editor-title"></h2>
    <div id="editor-key" hidden>
      <label for="key" class="caption">名称</label>
      <input id="key" maxlength="128" spellcheck="false">
    </div>
    <div id="editor-value">
      <label for="new-value" class="caption">存储值</label>
      <textarea id="new-value" spellcheck="false"></textarea>
      <span id="bytes" class="caption"></span>
    </div>
    <div id="editor-actions">
      <button type="submit" id="commit">保存</button>
      <button type="button" id="cancel">取消</button>
    </div>
  </form>
  <ul id="results" aria-label="站点数据条目" hidden></ul>
  <nav aria-label="存储条目分页" class="pager" id="storage-pager" hidden>
    <span id="storage-range" aria-live="polite"></span>
    <button id="storage-prev">上一页</button>
    <button id="storage-next">下一页</button>
  </nav>
  <p id="details"></p>
</main>
<script>
  const el = id => document.getElementById(id);
  const status = el('status'), details = el('details'), rows = el('results'), search = el('search');
  const buttons = [...document.querySelectorAll('[data-group]')];
  const editor=el('editor'), feedback=el('feedback'), newValue=el('new-value'), commit=el('commit');
  const newKey=el('key'), storageActions=el('storage-actions'), clearStorage=el('clear-storage');
  const clearCookies=el('clear-cookies');
  const storagePager=el('storage-pager'), storagePrev=el('storage-prev'), storageNext=el('storage-next');
  let seq=0, group='cookies', selected, page, catalog, request=0, latest, refreshing=false, writable=false, draft;
  let clearing=false, cookieGeneration, cookieClear=false, cookieRemove=false, cacheWritable=false;
  let databasePreview;
  let recordView, recordsAllowed=false, databaseWritable=false;
  let recordRestore;
  let dismissedMutation;
  let storageGeneration, storageOffset=0, searchTimer, restoreStorage=false;
  const cookieTrail=[];
  const isDOMStorage=() => group==='local' || group==='session';
  const isPagedGroup=() => isDOMStorage() || (group==='cookies' && cookieGeneration!==undefined);
  const isCatalog=() => group==='indexedDB' || group==='cacheStorage';
  async function host(method,params={}) {
    const id='sites:' + ++seq;
    const reply=JSON.parse(await window.webkit.messageHandlers.moonHost.postMessage(JSON.stringify({jsonrpc:'2.0',id,method,params})));
    if (reply.id !== id || reply.error) throw Error(reply.error?.message || 'INVALID_RESPONSE');
    return reply.result;
  }
  function closeEditor(refocus=false) {
    const previous=draft;
    draft=undefined;
    newKey.value='';
    newValue.value='';
    editor.hidden=true;
    if (refocus && previous?.button.isConnected) previous.button.focus();
  }
  function clear() {
    rows.replaceChildren();
    rows.hidden=storagePager.hidden=true;
    page=catalog=databasePreview=recordView=undefined;
    storageActions.hidden=clearCookies.hidden=true;
    closeEditor();
  }
  function lengthHint() {
    const length=new TextEncoder().encode(newValue.value).length;
    el('bytes').textContent=length + ' / 1024 字节';
    commit.disabled=length>1024;
  }
  async function openEditor(item, button, remove) {
    const current=page;
    const target={group,id:item.id,generation:current.generation,pageRevision:current.pageRevision};
    let value='';
    if (!remove) {
      try { value=await host('siteData.value',target); }
      catch { feedback.textContent='该条目已过期，请刷新。'; return; }
    }
    if (current!==page || document.hidden || !button.isConnected) return;
    feedback.textContent='';
    el('editor-title').textContent=(remove?'删除条目「':'编辑条目「') + (item.name || '空名称') + '」';
    el('editor-key').hidden=true;
    el('editor-value').hidden=remove;
    commit.textContent=remove?'确认删除':'保存';
    newValue.value=value;
    draft={target,remove,button,initial:newValue.value};
    lengthHint();
    editor.hidden=false;
    (remove ? el('cancel') : newValue).focus();
  }
  el('create').onclick=() => {
    if (!page?.available || storageActions.hidden || clearing) return;
    closeEditor();
    feedback.textContent='';
    el('editor-title').textContent='新增条目';
    el('editor-key').hidden=el('editor-value').hidden=false;
    commit.textContent='新增';
    draft={target:{group,generation:page.generation},create:true,button:el('create')};
    lengthHint();
    editor.hidden=false;
    newKey.focus();
  };
  clearStorage.onclick=async () => {
    if (!page?.available || storageActions.hidden || clearing) return;
    const current=page;
    const currentGroup=group;
    dismissedMutation=current.generation;
    clearing=true;
    clearStorage.disabled=el('create').disabled=true;
    feedback.textContent='';
    try {
      const result=await host('siteData.clear',{group:currentGroup,generation:current.generation});
      if (result==='started') { closeEditor(); await update(); }
      else if (currentGroup===group) feedback.textContent=result==='cancelled' ? '已取消。' : '存储已变化，请刷新。';
    } catch {
      if (currentGroup===group) feedback.textContent='无法清空此类存储，请刷新后重试。';
    } finally {
      clearing=false;
      renderStorageActions();
      if (!storageActions.hidden && !clearStorage.disabled) clearStorage.focus();
    }
  };
  newValue.oninput=lengthHint;
  el('cancel').onclick=() => closeEditor(true);
  editor.onsubmit=async event => {
    event.preventDefault();
    if (!draft || commit.disabled) return;
    const {target,remove,initial,create}=draft;
    if (!create && !remove && newValue.value===initial) {
      closeEditor(true);
      feedback.textContent='没有修改。';
      return;
    }
    commit.disabled=true;
    try {
      if (create) await host('siteData.create',{...target,key:newKey.value,value:newValue.value});
      else await host('siteData.update',{...target,value:remove ? null : newValue.value});
      closeEditor();
      await update();
    } catch {
      closeEditor();
      feedback.textContent='操作未提交，请刷新后重试。';
    }
  };
  function renderStorageActions() {
    storageActions.hidden=!(writable && page?.available && isDOMStorage());
    clearCookies.hidden=group!=='cookies' || selected!=='ready' || !cookieClear || !page;
    el('create').disabled=clearing;
    clearStorage.disabled=clearing || !page?.storageCount;
  }
  clearCookies.onclick=()=>{
    if (!clearCookies.hidden && page) changeCatalog('siteData.clearCookies',{generation:page.generation},clearCookies);
  };
  function render() {
    renderStorageActions();
    if (isCatalog()) { renderCatalog(); return; }
    rows.replaceChildren();
    storagePager.hidden=true;
    if (!page?.available) {
      rows.hidden=true;
      status.textContent='这个网页无法读取所选数据。';
      return;
    }
    const query=search.value.trim().toLocaleLowerCase();
    for (const item of page.entries) {
      if (page.pageRevision===undefined && query && !item.name.toLocaleLowerCase().includes(query)) continue;
      const row=document.createElement('li'), entry=document.createElement('div'), content=document.createElement('div');
      entry.className='entry';
      const name=document.createElement('code'), caption=document.createElement('small'), value=document.createElement('pre');
      name.textContent=item.name || '（空名称）';
      caption.className='caption';
      caption.textContent=item.length + ' 字节' + (item.shortened ? ' · 已截断' : '');
      content.append(name,caption);
      if (page.cookieDetails) {
        const scope=document.createElement('small'), attributes=document.createElement('small');
        scope.className='caption cookie-meta';
        attributes.className='caption';
        scope.textContent=`域 ${item.domain} · 路径 ${item.path}` + (item.metadataShortened ? ' · 属性已截断' : '');
        attributes.textContent=[item.expiresAt==null ? '会话' : `到期 ${new Date(item.expiresAt).toLocaleString()}`,
          item.httpOnly && 'HttpOnly',item.secure && 'Secure'].filter(Boolean).join(' · ');
        content.append(scope,attributes);
      }
      const show=document.createElement('button');
      show.dataset.reveal='';
      show.textContent='显示值';
      show.setAttribute('aria-label','显示 ' + (item.name || '空名称') + ' 的值');
      value.hidden=true;
      show.onclick=async () => {
        if (!value.hidden) { value.textContent=''; value.hidden=true; show.textContent='显示值'; return; }
        const current=page;
        show.disabled=true;
        try {
          const target={id:item.id,generation:current.generation,pageRevision:current.pageRevision};
          const secret=current.cookieDetails ? await host('siteData.cookieValue',target) : await host('siteData.value',{group,...target});
          if (current!==page || !row.isConnected || document.hidden) return;
          value.textContent=secret || '（空值）';
          value.hidden=false;
          show.textContent='隐藏值';
        } catch { if (current===page && row.isConnected) status.textContent='该条目已变更或过期。请刷新。'; }
        finally { show.disabled=false; }
      };
      const actions=document.createElement('div');
      actions.className='actions';
      actions.append(show);
      if (page.cookieDetails && cookieRemove && item.removable) {
        const remove=document.createElement('button');
        const target={id:item.id,generation:page.generation,pageRevision:page.pageRevision};
        remove.textContent='删除';
        remove.setAttribute('aria-label','删除 '+item.name+'，路径 '+item.path);
        remove.onclick=() => changeCatalog('siteData.removeCookie',target,remove);
        actions.append(remove);
      }
      if (writable && group!=='cookies' && !item.shortened) {
        for (const remove of [false,true]) {
          const button=document.createElement('button');
          button.textContent=remove?'删除':'编辑';
          button.setAttribute('aria-label',button.textContent + ' ' + (item.name || '空名称'));
          button.onclick=() => openEditor(item,button,remove);
          actions.append(button);
        }
      }
      entry.append(content,actions);
      row.append(entry,value);
      rows.append(row);
    }
    rows.hidden=rows.children.length===0;
    status.textContent=rows.hidden ? (query ? '没有匹配的条目。' : '暂无数据。') : '';
    search.placeholder=page.cookieDetails ? '筛选名称、域或路径' : '按名称筛选';
    search.setAttribute('aria-label',search.placeholder);
    if (page.pageRevision!==undefined) {
      const end=page.offset+page.entries.length;
      storagePager.hidden=page.entries.length===0;
      el('storage-range').textContent=(page.offset+1)+'–'+end+(page.cookieDetails ? ' 条' : ' / '+page.total+' 条');
      storagePrev.disabled=page.offset===0;
      storageNext.disabled=page.cookieDetails ? page.next==null : end>=page.total;
    }
    details.textContent=(group==='cookies' ? (page.cookieDetails ? '显示与原网页域名、路径和协议匹配的 Cookie。' :
      '当前显示网页可读的 Cookie。可使用开发者工具查看其他 Cookie 属性。') : '') +
      (page.more ? ` 已显示前 ${page.entries.length} 条。` : '');
  }
  async function changeCatalog(method,target,button,restore) {
    if (clearing) return;
    const currentGroup=group;
    clearing=true;
    button.disabled=true;
    feedback.textContent='';
    try {
      const outcome=await host(method,target);
      if (outcome==='started') {
        if (restore && group===currentGroup) {
          recordRestore=restore;
          await restoreRecordView();
        }
        await update();
      }
      else if (group===currentGroup) feedback.textContent=outcome==='cancelled' ? '已取消。' : '条目已变化，请刷新。';
    } catch {
      if (group===currentGroup) feedback.textContent='无法修改所选条目，请刷新后重试。';
    } finally {
      clearing=false;
      button.disabled=false;
    }
  }
  async function toggleDatabase(index,generation) {
    recordView=undefined;
    if (databasePreview?.index===index) {
      databasePreview=undefined;
      renderCatalog();
      return;
    }
    const selection={index,generation,state:'pending'};
    databasePreview=selection;
    await fillDatabaseView('siteData.database',selection,{index,generation},() => databasePreview===selection);
  }
  async function fillDatabaseView(method, selection, query, active) {
    renderCatalog();
    try {
      for (let attempt=0; attempt<80 && active(); ++attempt) {
        const result=await host(method,{...query,refresh:attempt===0});
        if (!active()) return;
        if (result.state!=='pending') {
          Object.assign(selection,result);
          renderCatalog();
          return;
        }
        await new Promise(resolve => setTimeout(resolve,150));
      }
    } catch {}
    if (active()) {
      selection.state='unavailable';
      renderCatalog();
    }
  }
  function viewRecords(store,offset=0) {
    const {index,generation,revision}=databasePreview;
    const selection={store,offset,state:'pending'};
    recordView=selection;
    return fillDatabaseView('siteData.databaseRecords',selection,{index,generation,revision,store,offset},() => recordView===selection);
  }
  async function restoreRecordView() {
    const saved=recordRestore;
    if (!saved || group!=='indexedDB' || catalog?.state!=='ready' || catalog.generation===saved.generation) return;
    recordRestore=undefined;
    if (!recordsAllowed) return;
    const generation=catalog.generation;
    const index=catalog.indexedDB?.entries.findIndex(db=>!db.shortened&&db.name===saved.name&&db.version===saved.version);
    if (index===undefined || index<0) return;
    await toggleDatabase(index,generation);
    if (databasePreview?.generation!==generation || databasePreview.index!==index || databasePreview.state!=='ready') return;
    const store=databasePreview.stores.findIndex(item=>!item.shortened&&item.name===saved.store);
    if (store<0) return;
    await viewRecords(store,saved.offset);
    if (saved.offset && recordView?.store===store && recordView.offset===saved.offset &&
        recordView.state==='ready' && !recordView.records.length)
      await viewRecords(store,saved.offset-10);
    if (document.activeElement===document.body) rows.querySelector('[data-record-focus="refresh"]')?.focus();
  }
  function renderRecordView() {
    const panel=document.createElement('section');
    panel.id='record-preview';
    panel.className='record-preview';
    panel.setAttribute('aria-label','记录预览');
    const notice=text => {
      const line=document.createElement('p');
      line.setAttribute('role','status');
      line.textContent=text;
      panel.append(line);
    };
    if (recordView.state==='pending') { notice('正在读取记录…'); return panel; }
    if (recordView.state==='changed') { notice('数据库已变化。请刷新目录后重试。'); return panel; }
    if (recordView.state==='unavailable') { notice('暂时无法读取记录。'); return panel; }
    if (recordView.records.length) {
      const table=document.createElement('table');
      const header=table.createTHead().insertRow();
      const canRemove=databaseWritable && recordView.pageRevision>0;
      for (const label of canRemove ? ['主键','值预览','操作'] : ['主键','值预览']) {
        const column=document.createElement('th');
        column.scope='col';
        column.textContent=label;
        header.append(column);
      }
      const body=table.createTBody();
      for (const [index,record] of recordView.records.entries()) {
        const row=body.insertRow();
        for (const value of [record.key,record.value]) {
          const cell=row.insertCell(), text=document.createElement('pre');
          text.textContent=value.text;
          cell.append(text);
          if (value.shortened) {
            const note=document.createElement('small');
            note.className='caption';
            note.textContent='已截断或以摘要显示';
            cell.append(note);
          }
        }
        if (canRemove) {
          const actions=row.insertCell();
          if (!record.key.shortened) {
            const remove=document.createElement('button');
            remove.textContent='删除…';
            remove.setAttribute('aria-label','删除记录 '+record.key.text);
            const {store,offset,pageRevision}=recordView;
            const {index:databaseIndex,generation,revision}=databasePreview;
            const {name,version}=catalog.indexedDB.entries[databaseIndex];
            const restore={name,version,generation,offset,store:databasePreview.stores[store].name};
            remove.onclick=()=>changeCatalog('siteData.removeRecord',
              {index:databaseIndex,generation,revision,store,pageRevision,row:index},remove,restore);
            actions.append(remove);
          }
        }
      }
      panel.append(table);
    } else notice(recordView.offset ? '这一页没有记录。' : '此仓库没有记录。');
    if (recordView.capped) notice('已到前 200 条的预览上限。');
    const controls=document.createElement('div');
    controls.className='record-controls';
    const addControl=(text,key,offset) => {
      const button=document.createElement('button');
      button.textContent=text;
      button.dataset.recordFocus=key;
      button.disabled=offset===null;
      button.onclick=() => viewRecords(recordView.store,offset);
      controls.append(button);
    };
    addControl('上一页','previous',recordView.offset ? recordView.offset-10 : null);
    addControl('下一页','next',recordView.next);
    addControl('刷新记录','refresh',recordView.offset);
    panel.append(controls);
    return panel;
  }
  function displayKey(key) {
    if (key===null) return '无';
    const value=key.compound ? JSON.stringify(key.parts) : JSON.stringify(key.parts[0] ?? '');
    return value + (key.shortened ? '（已截断）' : '');
  }
  function renderDatabase() {
    const preview=document.createElement('section');
    preview.id='database-preview';
    preview.className='db-preview';
    preview.setAttribute('aria-label','数据库结构');
    const notice=text => {
      const line=document.createElement('p');
      line.setAttribute('role','status');
      line.textContent=text;
      preview.append(line);
    };
    if (databasePreview.state!=='ready') {
      notice({
        pending:'正在读取数据库结构…',
        changed:'数据库已变化。请刷新目录后重试。',
        unavailable:'暂时无法读取数据库结构。',
      }[databasePreview.state]);
      return preview;
    }
    const list=document.createElement('ul');
    for (const [index,store] of databasePreview.stores.entries()) {
      const item=document.createElement('li'), title=document.createElement('strong'), summary=document.createElement('small');
      title.textContent=store.name || '（空名称）';
      summary.className='caption';
      summary.textContent='键路径 ' + displayKey(store.keyPath) + (store.autoIncrement ? ' · 自动递增' : '') +
        (store.shortened ? ' · 名称已截断' : '');
      item.append(title,summary);
      if (databaseWritable && !store.shortened) {
        const clear=document.createElement('button');
        const {index:databaseIndex,generation,revision}=databasePreview;
        clear.textContent='清空记录…';
        clear.setAttribute('aria-label','清空记录 '+(store.name || '（空名称）'));
        clear.onclick=() => changeCatalog('siteData.clearObjectStore',{index:databaseIndex,generation,revision,store:index},clear);
        item.append(clear);
      }
      if (recordsAllowed && !store.shortened) {
        const open=document.createElement('button'), expanded=recordView?.store===index;
        open.textContent=expanded ? '收起记录' : '查看记录';
        open.setAttribute('aria-label',open.textContent+' '+(store.name || '（空名称）'));
        open.setAttribute('aria-expanded',String(expanded));
        if (expanded) open.setAttribute('aria-controls','record-preview');
        open.dataset.recordFocus='store-'+index;
        open.onclick=() => {
          if (expanded) { recordView=undefined; renderCatalog(); }
          else viewRecords(index);
        };
        item.append(open);
        if (expanded) item.append(renderRecordView());
      }
      if (store.indexes.length) {
        const indexes=document.createElement('ul');
        indexes.setAttribute('aria-label','索引');
        for (const index of store.indexes) {
          const entry=document.createElement('li');
          entry.textContent=(index.name || '（空名称）') + ' · 键路径 ' + displayKey(index.keyPath) +
            (index.unique ? ' · 唯一' : '') + (index.multiEntry ? ' · 多值条目' : '') +
            (index.shortened ? ' · 名称已截断' : '');
          indexes.append(entry);
        }
        item.append(indexes);
      }
      if (store.more) {
        const note=document.createElement('small');
        note.className='caption';
        note.textContent='仅显示前 8 个索引。';
        item.append(note);
      }
      list.append(item);
    }
    if (list.childElementCount) preview.append(list);
    else if (!databasePreview.more) notice('此数据库没有对象仓库。');
    if (databasePreview.more) notice('还有对象仓库未显示。');
    return preview;
  }
  function renderCatalog() {
    const focusedDatabase=document.activeElement?.dataset.databaseIndex;
    const focusedRecords=document.activeElement?.dataset.recordFocus;
    rows.replaceChildren();
    rows.hidden=true;
    details.textContent='';
    const label=group==='indexedDB' ? 'IndexedDB' : 'Cache Storage';
    if (catalog?.state==='pending') { status.textContent='正在读取 ' + label + '…'; return; }
    const section=catalog?.[group];
    if (!section) { status.textContent='此网页无法读取 ' + label + '。'; return; }
    const query=search.value.trim().toLocaleLowerCase();
    for (const [index,item] of section.entries.entries()) {
      if (query && !item.name.toLocaleLowerCase().includes(query)) continue;
      const row=document.createElement('li'), name=document.createElement('code');
      const heading=document.createElement('div'), info=document.createElement('div');
      heading.className='entry';
      heading.append(info);
      row.append(heading);
      name.textContent=item.name || '（空名称）';
      info.append(name);
      const text=item.version != null ? `版本 ${item.version}` : '';
      if (text || item.shortened) {
        const caption=document.createElement('small');
        caption.className='caption';
        caption.textContent=[text,item.shortened ? '名称已截断' : ''].filter(Boolean).join(' · ');
        info.append(caption);
      }
      if (group==='cacheStorage' && cacheWritable && !item.shortened) {
        const remove=document.createElement('button');
        const generation=catalog.generation;
        remove.textContent='删除缓存';
        remove.setAttribute('aria-label', '删除缓存 '+(item.name || '（空名称）'));
        remove.onclick=() => changeCatalog('siteData.cacheRemove',{index,generation},remove);
        heading.append(remove);
      }
      if (group==='indexedDB' && !item.shortened && item.version!=null) {
        const open=document.createElement('button'), expanded=databasePreview?.index===index;
        const generation=catalog.generation;
        open.dataset.databaseIndex=String(index);
        open.textContent=expanded ? '收起结构' : '查看结构';
        open.setAttribute('aria-expanded',String(expanded));
        if (expanded) open.setAttribute('aria-controls','database-preview');
        open.onclick=() => toggleDatabase(index,generation);
        heading.append(open);
        if (expanded) row.append(renderDatabase());
      }
      rows.append(row);
    }
    if (focusedDatabase!==undefined)
      rows.querySelector('[data-database-index="' + focusedDatabase + '"]')?.focus();
    if (focusedRecords!==undefined)
      (rows.querySelector('[data-record-focus="' + focusedRecords + '"]:not(:disabled)') ||
        rows.querySelector('[data-record-focus="store-' + recordView?.store + '"]'))?.focus();
    rows.hidden=rows.children.length===0;
    status.textContent=rows.hidden ? (query ? '没有匹配的条目。' : `此网页尚未创建 ${label} 条目。`) : '';
    details.textContent=(section.more ? '已显示前 32 条。' : '') +
      (group==='indexedDB' ? '可在开发者工具的 Storage 面板继续检查。' : '');
  }
  async function loadStorage(ticket) {
    const query={group,generation:storageGeneration,query:search.value.trim(),offset:storageOffset};
    const focus=document.activeElement;
    rows.replaceChildren();
    rows.hidden=true;
    page=undefined;
    closeEditor();
    renderStorageActions();
    storagePrev.disabled=storageNext.disabled=true;
    status.textContent='正在读取存储条目…';
    for (let attempt=0; attempt<24; ++attempt) {
      const result=await host('siteData.storagePage',{...query,refresh:attempt===0});
      if (request!==ticket || document.hidden) return;
      if (result.state==='ready') {
        if (!result.entries.length && storageOffset && result.total<=storageOffset) {
          storageOffset=Math.max(0,Math.ceil(result.total/32)-1)*32;
          return load();
        }
        page={...result,available:true};
        render();
        restorePagerFocus(focus);
        return;
      }
      if (result.state==='unavailable') break;
      await new Promise(resolve => setTimeout(resolve,120));
      if (request!==ticket || document.hidden) return;
    }
    throw Error('Storage page unavailable');
  }
  function restorePagerFocus(focus) {
    if (focus!==storagePrev && focus!==storageNext) return;
    if (document.activeElement!==focus && document.activeElement!==document.body) return;
    const button=focus.disabled ? (focus===storageNext ? storagePrev : storageNext) : focus;
    (button.disabled ? search : button).focus();
  }
  storagePrev.onclick=() => {
    if (!page) return;
    storageOffset=page.cookieDetails ? (cookieTrail.pop() ?? 0) : Math.max(0,page.offset-32);
    load();
  };
  storageNext.onclick=() => {
    if (!page) return;
    if (page.cookieDetails) {
      cookieTrail.push(page.offset);
      storageOffset=page.next;
    } else storageOffset=page.offset+page.entries.length;
    load();
  };
  async function load() {
    const ticket=++request;
    try {
      if (isCatalog()) {
        const value=await host('siteData.catalog',{group});
        if (ticket!==request) return;
        if (databasePreview?.generation!==value.generation) databasePreview=recordView=undefined;
        catalog=value;
        search.placeholder='按名称筛选';
        search.setAttribute('aria-label',search.placeholder);
        renderCatalog();
        await restoreRecordView();
        return;
      }
      if (isDOMStorage()) { await loadStorage(ticket); return; }
      if (group==='cookies' && cookieGeneration!==undefined) {
        const focus=document.activeElement;
        storagePrev.disabled=storageNext.disabled=true;
        const detailsPage=await host('siteData.cookiePage',{
          generation:cookieGeneration,query:search.value.trim(),offset:storageOffset
        }).catch(() => null);
        if (ticket!==request || document.hidden) return;
        if (detailsPage?.available) {
          if (detailsPage.offset && !detailsPage.entries.length) {
            storageOffset=cookieTrail.pop() ?? 0;
            return load();
          }
          page={...detailsPage,cookieDetails:true};
          render();
          restorePagerFocus(focus);
          return;
        }
      }
      const value=await host('siteData.list',{group});
      if (ticket!==request) return;
      page=value;
      render();
    } catch {
      if (ticket!==request) return;
      clear();
      if (isCatalog()) renderCatalog();
      else if (isDOMStorage()) status.textContent='无法读取存储条目。请刷新后重试。';
    }
  }
  const states={
    idle:'请回到要检查的网页，从命令面板选择「查看当前站点数据」。',
    pending:'正在读取站点数据…',
    stale:'原网页已关闭或切换。请在目标网页上重新打开站点数据。',
    expired:'预览已过期，可以刷新获取当前数据。',
    unavailable:'WebKit 暂时无法读取此网页的数据。'
  };
  const messages={
    saved:'已保存。', removed:'已删除。', cleared:'已清空所选存储。', conflict:'名称已存在或条目已变更，已刷新为当前值。',
    failed:'此网页的存储不可写，修改未保存。'
  };
  async function update() {
    if (refreshing) return;
    refreshing=true;
    try {
      const current=await host('siteData.status');
      writable=current.writable;
      cacheWritable=current.cacheWritable;
      recordsAllowed=current.recordPreview;
      databaseWritable=current.databaseWritable;
      cookieClear=current.cookieClear===true;
      cookieRemove=current.cookieRemove===true;
      if (group==='cookies' && current.generation!==storageGeneration && current.mutation!=='removed') {
        storageOffset=0;
        cookieTrail.length=0;
      }
      cookieGeneration=current.cookieDetails ? current.generation : undefined;
      storageGeneration=current.generation;
      el('origin').textContent=current.origin;
      const unavailable=['idle','stale','pending'].includes(current.state);
      el('refresh').disabled=el('inspector').disabled=unavailable;
      const identity=current.state + ':' + current.generation + ':' + writable + ':' + current.cookieDetails + ':' + cookieClear + ':' + cookieRemove + ':' + cacheWritable + ':' + recordsAllowed + ':' + databaseWritable;
      if (identity===latest) {
        if (selected==='ready' && ((isCatalog() && (!catalog || catalog.state==='pending')) ||
          (isPagedGroup() && restoreStorage))) {
          restoreStorage=false;
          await load();
        }
        return;
      }
      latest=identity;
      selected=current.state;
      if (current.state!=='pending' && current.state!=='ready') recordRestore=undefined;
      request++;
      if (databasePreview?.generation!==current.generation) databasePreview=recordView=undefined;
      if (!recordsAllowed) recordView=undefined;
      closeEditor();
      if (current.state!=='ready' || current.generation!==dismissedMutation)
        feedback.textContent=current.mutation==='cleared' && group==='cookies' ? '已清除站点 Cookie。' : messages[current.mutation] || '';
      if (selected==='ready') await load();
      else { clear(); details.textContent=''; status.textContent=states[selected] || ''; }
    } catch {
      clear();
      details.textContent='';
      el('refresh').disabled=el('inspector').disabled=true;
      status.textContent='请在插件菜单允许查看站点数据。';
    } finally { refreshing=false; }
  }
  for (const button of buttons) button.onclick=() => {
    clearTimeout(searchTimer);
    group=button.dataset.group;
    ++request;
    storageOffset=0;
    cookieTrail.length=0;
    recordRestore=undefined;
    for (const other of buttons) other.setAttribute('aria-pressed',String(other===button));
    clear();
    details.textContent='';
    feedback.textContent='';
    if (selected==='ready') load();
  };
  search.oninput=() => {
    if (isPagedGroup() && selected==='ready') {
      ++request;
      storageOffset=0;
      cookieTrail.length=0;
      clear();
      status.textContent='正在筛选条目…';
      clearTimeout(searchTimer);
      searchTimer=setTimeout(load,150);
    } else if (page || catalog) render();
  };
  el('refresh').onclick=async () => {
    try { if (!await host('siteData.refresh')) throw Error(); await update(); }
    catch { status.textContent='无法刷新。请回到目标网页重新打开面板。'; }
  };
  el('inspector').onclick=async () => {
    try { if (!await host('siteData.openInspector')) throw Error(); }
    catch { status.textContent='请检查开发者工具插件是否已启用。'; }
  };
  document.addEventListener('visibilitychange',() => {
    if (document.hidden) {
      if (isPagedGroup()) {
        ++request;
        clearTimeout(searchTimer);
        restoreStorage=true;
        clear();
      }
      if (recordView) { recordView=undefined; renderCatalog(); }
      closeEditor();
      for (const value of rows.querySelectorAll('pre')) { value.textContent=''; value.hidden=true; }
      for (const button of rows.querySelectorAll('[data-reveal]')) button.textContent='显示值';
    } else { update(); }
  });
  setInterval(() => { if (!document.hidden) update(); },600);
  update();
</script>
</html>
