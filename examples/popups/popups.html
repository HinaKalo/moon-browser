<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站点设置</title>
<style>
  :root { color-scheme:light; font:14px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif; --page:#f5f6f9; --panel:#fff; --text:#14161d; --muted:#51586a; --line:#d9dce6; --accent:#354db8; --soft:#e8ecff; background:var(--page); color:var(--text); }
  :root[data-moon-theme=dark] { color-scheme:dark; --page:#191c23; --panel:#20232c; --text:#e9ebf2; --muted:#b7becf; --line:#3a4256; --accent:#adbcff; --soft:#2b365e; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; }
  main { max-width:850px; margin:auto; padding:30px clamp(16px,5vw,42px) 36px; }
  h1,h2,p { margin:0; }
  h1 { font-size:28px; }
  h2 { font-size:17px; margin-bottom:10px; }
  header p,#results:empty+.empty,.hint { color:var(--muted); }
  header p { margin-top:5px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:14px; }
  .row,form,li { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; }
  .origin { font:13px/1.45 Consolas,monospace; overflow-wrap:anywhere; min-width:0; }
  .notice { border-left:3px solid var(--accent); padding:9px 0 2px 11px; margin-top:10px; }
  button,input,select { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  button { cursor:pointer; }
  button:hover:not(:disabled) { color:var(--accent); border-color:var(--accent); }
  button:disabled { opacity:.6; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input { flex:1; min-width:min(200px,100%); }
  ul { list-style:none; padding:0; margin:0; }
  li { border-top:1px solid var(--line); padding:10px 0; }
  li:first-child { border-top:0; padding-top:0; }
  li:last-child { padding-bottom:0; }
  li > div:first-child { flex:1; }
  .policy { color:var(--muted); font-size:13px; margin-top:3px; }
  #status { color:var(--accent); margin-top:10px; }
  #status:empty,.empty { display:none; }
  #results:empty+.empty { display:block; }
  #autoplay-results:empty+.empty,#sound-results:empty+.empty,#zoom-results:empty+.empty { display:block; }
  #autoplay-list,#sound-list,#zoom-list { margin-top:14px; }
  #autoplay-status,#sound-status,#zoom-status { margin-top:10px; color:var(--accent); }
  #autoplay-status:empty,#sound-status:empty,#zoom-status:empty { display:none; }
  #zoom-query { width:100%; margin-bottom:12px; }
  #zoom-pages { justify-content:flex-end; margin-top:12px; }
  #site-tools,#site-summary { justify-content:flex-start; margin-top:12px; }
  #site-summary button { background:var(--soft); border-color:transparent; }
  #site-tool-status:not(:empty) { margin-top:10px; color:var(--muted); }
  #notification-results { margin-top:14px; }
  #notification-results:empty+.empty { display:block; }
  #notification-status:not(:empty) { margin-top:10px; color:var(--accent); }
</style>
<main>
  <header><h1>站点设置</h1><p>按网站保存规则。HTTP、HTTPS 和不同端口各自设置。</p></header>
  <section id="current" hidden>
    <h2>当前网站</h2>
    <div class="row"><code id="current-origin" class="origin"></code><button id="use-current" type="button">编辑弹窗规则</button></div>
    <div id="notice" class="notice row" hidden>
      <div><p id="blocked-summary"></p><code id="blocked-target" class="origin"></code></div>
      <button id="open-blocked" type="button">打开一次</button>
    </div>
    <div class="row" id="site-summary" role="group" aria-label="当前网站规则" hidden>
      <button type="button" id="current-autoplay" hidden></button>
      <button type="button" id="current-sound" hidden></button>
      <button type="button" id="current-zoom" hidden></button>
      <button type="button" id="current-notifications" hidden></button>
    </div>
    <div class="row" id="site-tools" role="group" aria-label="当前网页工具" hidden>
      <button type="button" data-tool="page">返回网页</button>
      <button type="button" data-tool="data">查看站点数据</button>
      <button type="button" data-tool="console">打开控制台</button>
    </div>
    <p id="site-tool-status" role="status"></p>
  </section>
  <section id="notifications" hidden>
    <h2>网站通知</h2>
    <form id="notification-form">
      <input id="notification-origin" required spellcheck="false" inputmode="url" aria-label="接收通知的网站 URL" placeholder="https://example.com">
      <select id="notification-mode" aria-label="网站通知规则">
        <option value="ask">询问</option>
        <option value="allow">允许</option>
        <option value="block">阻止</option>
      </select>
      <button id="notification-save" type="submit">保存</button>
    </form>
    <p id="notification-status" role="status"></p>
    <ul id="notification-results" aria-label="网站通知例外"></ul>
    <p class="empty">暂无通知例外。</p>
  </section>
  <section>
    <h2>弹窗例外</h2>
    <ul id="results"></ul>
    <p class="empty">暂无网站例外。</p>
  </section>
  <section>
    <h2>添加或编辑弹窗规则</h2>
    <form id="rule-form">
      <input id="origin" required spellcheck="false" inputmode="url" aria-label="网站 URL" placeholder="https://example.com">
      <select id="mode" aria-label="弹窗权限">
        <option value="allow">允许自动弹窗</option>
        <option value="block">阻止新窗口</option>
        <option value="automatic">恢复默认</option>
      </select>
      <button id="save" type="submit">保存</button>
    </form>
    <p id="status" role="status"></p>
  </section>
  <section id="autoplay" hidden>
    <h2>媒体自动播放</h2>
    <form id="autoplay-form">
      <input id="autoplay-origin" required spellcheck="false" inputmode="url" aria-label="自动播放的网站 URL" placeholder="https://example.com">
      <select id="autoplay-mode" aria-label="媒体自动播放规则">
        <option value="automatic">使用默认设置</option>
        <option value="allow">允许自动播放</option>
        <option value="muted">仅允许静音自动播放</option>
        <option value="block">阻止自动播放</option>
      </select>
      <button id="autoplay-save" type="submit">保存</button>
    </form>
    <p id="autoplay-status" role="status"></p>
    <div id="autoplay-list">
      <ul id="autoplay-results" aria-label="自动播放例外"></ul>
      <p class="empty">暂无自动播放例外。</p>
    </div>
  </section>
  <section id="sound" hidden>
    <h2>网站声音</h2>
    <form id="sound-form">
      <input id="sound-origin" required spellcheck="false" inputmode="url" aria-label="网站 URL" placeholder="https://example.com">
      <button id="sound-save" type="submit">静音此网站</button>
    </form>
    <p id="sound-status" role="status"></p>
    <div id="sound-list">
      <ul id="sound-results" aria-label="静音网站"></ul>
      <p class="empty">暂无静音网站。</p>
    </div>
  </section>
  <section id="zoom" hidden>
    <h2>网站缩放</h2>
    <form id="zoom-form">
      <input id="zoom-origin" required spellcheck="false" inputmode="url" aria-label="缩放的网站 URL" placeholder="https://example.com">
      <select id="zoom-percent" aria-label="网页缩放比例"></select>
      <button id="zoom-save" type="submit">保存比例</button>
    </form>
    <p id="zoom-status" role="status"></p>
    <div id="zoom-list">
      <input id="zoom-query" type="search" maxlength="100" aria-label="搜索缩放例外" placeholder="搜索已保存的网站">
      <ul id="zoom-results" aria-label="网站缩放例外"></ul>
      <p class="empty">没有匹配的缩放例外。</p>
      <div class="row" id="zoom-pages" hidden>
        <button id="zoom-prev" type="button">上一页</button>
        <button id="zoom-next" type="button">下一页</button>
      </div>
    </div>
  </section>
</main>
<script>
  const get = id => document.getElementById(id);
  const tools = [...document.querySelectorAll('[data-tool]')];
  let overview, overviewRevision=0;
  const input = get('origin'), mode = get('mode'), rows = get('results'), status = get('status');
  const labels = {allow:'允许自动弹窗', block:'阻止新窗口'};
  const autoplayInput = get('autoplay-origin'), autoplayMode = get('autoplay-mode'), autoplayStatus = get('autoplay-status');
  const autoplayLabels = {allow:'允许自动播放',muted:'仅允许静音自动播放',block:'阻止自动播放'};
  const notificationLabels = {ask:'询问',allow:'允许',block:'阻止'};
  const notificationInput = get('notification-origin'), notificationMode = get('notification-mode');
  let notificationOrigin, notificationBusy = false, notificationRevision = 0;
  const soundInput = get('sound-origin'), soundStatus = get('sound-status');
  let soundOrigin, soundBusy = false;
  const messages = {
    INVALID_PARAMS:'请输入有效的 HTTP 或 HTTPS 网站地址。',
    LIMIT_EXCEEDED:'网站例外已达上限，请先移除不再需要的规则。',
    CANCELLED:'操作已取消。',
    PERMISSION_DENIED:'请在插件管理页启用网站弹窗权限。'
  };
  let sequence = 0, current, busy = false, autoplayBusy = false, autoplayOrigin;
  async function host(method, params = {}) {
    const id = 'popups:' + ++sequence;
    const result = JSON.parse(await window.webkit.messageHandlers.moonHost.postMessage(JSON.stringify({jsonrpc:'2.0', id, method, params})));
    if (result.id !== id || result.error) throw Error(result.error?.data?.reason || 'UNAVAILABLE');
    return result.result;
  }
  function edit(origin, selected) {
    input.value = origin;
    mode.value = selected;
    input.focus();
  }
  async function refreshOverview() {
    const revision=++overviewRevision;
    let site;
    try { site=await host('siteSettings.current'); } catch {}
    if (revision!==overviewRevision) return;
    overview=site;
    get('site-summary').hidden=!(site?.origin && [site.autoplay,site.muted,site.zoom,site.notifications].some(value=>value!=null));
    get('site-tools').hidden=!site?.tools.length;
    for (const button of tools) button.hidden=!site?.tools.includes(button.dataset.tool);
    get('use-current').textContent='弹窗 · '+(labels[site?.popups] || '默认规则');
    const playback=get('current-autoplay'), sound=get('current-sound'), zoom=get('current-zoom');
    playback.hidden=site?.autoplay==null;
    sound.hidden=site?.muted==null;
    zoom.hidden=site?.zoom==null;
    const notifications=get('current-notifications');
    notifications.hidden=site?.notifications==null;
    if (!notifications.hidden) notifications.textContent='通知 · '+notificationLabels[site.notifications];
    if (!playback.hidden) playback.textContent='自动播放 · '+(autoplayLabels[site.autoplay] || '默认规则');
    if (!sound.hidden) sound.textContent=site.muted ? '取消网站静音' : '静音此网站';
    if (!zoom.hidden) zoom.textContent='缩放 · '+site.zoom+'%';
  }
  for (const button of tools) button.onclick=async () => {
    if (!overview?.revision) return;
    const result=get('site-tool-status');
    button.disabled=true;
    result.textContent='';
    try {
      if (!await host('siteSettings.openTool',{revision:overview.revision,tool:button.dataset.tool})) throw Error();
    } catch {
      await refreshOverview();
      result.textContent=overview?.revision ? '暂时无法打开该工具。' : '原网页已切换或关闭，请从目标网页重新打开站点设置。';
    } finally { button.disabled=false; }
  };
  get('current-autoplay').onclick=()=>{
    if (!overview?.origin || autoplayInput.disabled) return;
    autoplayInput.value=overview.origin;
    autoplayMode.value=overview.autoplay;
    autoplayMode.focus();
  };
  get('current-sound').onclick=()=>{ if (overview?.origin) saveSound(overview.origin,!overview.muted); };
  get('current-zoom').onclick=()=>{
    if (!overview?.origin || zoomPercent.disabled) return;
    zoomInput.value=overview.origin;
    zoomPercent.value=overview.zoom;
    zoomPercent.focus();
  };
  function editNotification(origin, mode) {
    if (notificationBusy) return;
    notificationInput.value=origin;
    notificationMode.value=mode;
    notificationMode.focus();
  }
  get('current-notifications').onclick=()=>{
    if (overview?.origin) editNotification(overview.origin,overview.notifications);
  };
  async function refreshNotifications() {
    const revision=++notificationRevision;
    try {
      const data=await host('siteSettings.notifications.get');
      if (revision!==notificationRevision) return;
      if (notificationOrigin!==data.currentOrigin || !notificationInput.value) {
        notificationOrigin=data.currentOrigin;
        notificationInput.value=notificationOrigin || '';
        notificationMode.value=data.rules.find(rule=>rule.origin===notificationOrigin)?.mode || 'ask';
      }
      renderRules(get('notification-results'),data.rules,notificationLabels,
        rule=>editNotification(rule.origin,rule.mode),rule=>saveNotification(rule.origin,'ask'));
      get('notifications').hidden=false;
    } catch {
      if (revision===notificationRevision) get('notifications').hidden=true;
    }
  }
  async function saveNotification(origin,mode) {
    if (notificationBusy) return;
    notificationBusy=true;
    const status=get('notification-status');
    const controls=[notificationInput,notificationMode,get('notification-save')];
    for (const control of controls) control.disabled=true;
    try {
      const rule=await host('siteSettings.notifications.set',{origin,mode});
      if (notificationInput.value===origin) {
        notificationInput.value=rule.origin;
        notificationMode.value=rule.mode;
      }
      await Promise.all([refreshNotifications(),refreshOverview()]);
      status.textContent='已保存网站通知规则。';
    } catch (error) {
      status.textContent=messages[error.message] || '暂时无法保存网站通知规则。';
    } finally {
      notificationBusy=false;
      for (const control of controls) control.disabled=false;
    }
  }
  get('notification-form').onsubmit=event=>{
    event.preventDefault();
    saveNotification(notificationInput.value.trim(),notificationMode.value);
  };
  async function refresh() {
    current = await host('popups.status');
    get('current').hidden = !current.currentOrigin;
    get('current-origin').textContent = current.currentOrigin || '';
    get('notice').hidden = !current.blocked;
    if (current.blocked) {
      get('blocked-summary').textContent = '已拦截 ' + current.blocked.count + ' 次 · 最近目标';
      get('blocked-target').textContent = current.blocked.targetOrigin;
    }
    renderRules(rows,current.rules,labels,rule => edit(rule.origin,rule.mode),rule => setRule(rule.origin,'automatic'));
  }
  function renderRules(list, rules, names, editRule, resetRule) {
    list.replaceChildren();
    for (const rule of rules.sort((a,b) => a.origin.localeCompare(b.origin))) {
      const row = document.createElement('li');
      const text = document.createElement('div');
      const key = document.createElement('code');
      key.className = 'origin';
      key.textContent = rule.origin;
      const label = document.createElement('p');
      label.className = 'policy';
      label.textContent = names[rule.mode];
      text.append(key,label);
      const change = document.createElement('button');
      change.textContent = '编辑';
      change.onclick = () => editRule(rule);
      const reset = document.createElement('button');
      reset.textContent = '恢复默认';
      reset.onclick = () => resetRule(rule);
      row.append(text,change,reset);
      list.append(row);
    }
  }
  async function setRule(origin, value) {
    if (busy) return;
    busy = true;
    get('save').disabled = true;
    try {
      await host('popups.setRule',{origin,mode:value});
      await refresh();
      await refreshOverview();
      status.textContent = value === 'automatic' ? '已恢复默认规则。' : '网站规则已保存。';
    } catch (error) {
      status.textContent = messages[error.message] || '暂时无法保存网站规则。';
    } finally {
      busy = false;
      get('save').disabled = false;
    }
  }
  get('use-current').onclick = () => {
    if (current?.currentOrigin) edit(current.currentOrigin,current.rules.find(rule => rule.origin === current.currentOrigin)?.mode || 'allow');
  };
  get('rule-form').onsubmit = event => { event.preventDefault(); setRule(input.value.trim(),mode.value); };
  get('open-blocked').onclick = async () => {
    if (!current?.blocked || busy) return;
    busy = true;
    try {
      const opened = await host('popups.openBlocked',{id:current.blocked.id});
      await refresh();
      status.textContent = opened ? '已打开新的标签页。' : '未打开弹窗。';
    } catch {
      status.textContent = '暂时无法打开此链接。';
    } finally {
      busy = false;
    }
  };
  async function refreshAutoplay() {
    const permissions = await host('siteSettings.autoplay.get');
    if (autoplayOrigin !== permissions.currentOrigin) {
      autoplayOrigin = permissions.currentOrigin;
      autoplayInput.value = permissions.currentOrigin || '';
      autoplayMode.value = permissions.rules.find(rule => rule.origin === permissions.currentOrigin)?.mode || 'automatic';
    }
    get('autoplay').hidden = false;
    renderRules(get('autoplay-results'),permissions.rules,autoplayLabels,rule => {
      autoplayInput.value = rule.origin;
      autoplayMode.value = rule.mode;
      autoplayMode.focus();
    },rule => saveAutoplay(rule.origin,'automatic'));
  }
  async function saveAutoplay(origin, value) {
    if (autoplayBusy) return;
    autoplayBusy = get('autoplay-save').disabled = true;
    try {
      await host('siteSettings.autoplay.set',{origin,mode:value});
      await refreshAutoplay();
      await refreshOverview();
      if (autoplayInput.value === origin) autoplayMode.value = value;
      autoplayStatus.textContent = value === 'automatic' ? '已恢复默认设置。下次打开或刷新网页时生效。' : '已保存。下次打开或刷新网页时生效。';
    } catch (error) {
      autoplayStatus.textContent = error.message === 'PERMISSION_DENIED' ? '请在插件管理页授权媒体自动播放。' :
        messages[error.message] || '暂时无法保存自动播放规则。';
    } finally { autoplayBusy = get('autoplay-save').disabled = false; }
  }
  get('autoplay-form').onsubmit = event => { event.preventDefault(); saveAutoplay(autoplayInput.value.trim(),autoplayMode.value); };
  async function refreshSound() {
    const site = await host('siteSettings.sound.get');
    if (soundOrigin !== site.currentOrigin) {
      soundOrigin = site.currentOrigin;
      soundInput.value = soundOrigin || '';
    }
    get('sound').hidden = false;
    const list = get('sound-results');
    list.replaceChildren();
    for (const origin of site.muted.sort((a,b) => a.localeCompare(b))) {
      const row = document.createElement('li'), text = document.createElement('code'), restore = document.createElement('button');
      text.className = 'origin';
      text.textContent = origin;
      restore.textContent = '取消静音';
      restore.setAttribute('aria-label','取消 ' + origin + ' 的网站静音');
      restore.onclick = () => saveSound(origin,false);
      row.append(text,restore);
      list.append(row);
    }
  }
  async function saveSound(origin, muted) {
    if (soundBusy) return;
    soundBusy = get('sound-save').disabled = true;
    try {
      await host('siteSettings.sound.set',{origin,muted});
      await refreshSound();
      await refreshOverview();
      soundStatus.textContent = muted ? '此网站已静音。' : '已取消网站静音。';
    } catch (error) {
      soundStatus.textContent = messages[error.message] || '暂时无法修改网站静音。';
    } finally { soundBusy = get('sound-save').disabled = false; }
  }
  get('sound-form').onsubmit = event => { event.preventDefault(); saveSound(soundInput.value.trim(),true); };
  const zoomInput=get('zoom-origin'), zoomPercent=get('zoom-percent'), zoomSearch=get('zoom-query'), zoomStatus=get('zoom-status');
  const zoomPrev=get('zoom-prev'), zoomNext=get('zoom-next');
  let zoomBack=null, zoomMore=null, zoomBound, zoomCurrentPercent, zoomRevision=0, zoomBusy=false, zoomDebounce;
  function renderZoomControls() {
    for (const id of ['zoom-origin','zoom-percent','zoom-save']) get(id).disabled=zoomBusy || !zoomPercent.options.length;
    zoomPrev.disabled=zoomBusy || zoomBack===null;
    zoomNext.disabled=zoomBusy || zoomMore===null;
    get('zoom-pages').hidden=zoomBack===null && zoomMore===null;
  }
  async function refreshZoom(offset) {
    const revision=++zoomRevision;
    try {
      const page=await host('siteSettings.zoom.get',{query:zoomSearch.value.trim(),offset});
      if (revision!==zoomRevision) return;
      if (!zoomPercent.options.length) {
        for (const percent of page.levels) {
          const option=document.createElement('option');
          option.value=percent;
          option.textContent=percent+'%';
          zoomPercent.append(option);
        }
      }
      if (zoomBound!==page.currentOrigin ||
          (zoomInput.value===zoomBound && Number(zoomPercent.value)===zoomCurrentPercent)) {
        zoomInput.value=page.currentOrigin || '';
        zoomPercent.value=page.currentPercent;
      }
      zoomBound=page.currentOrigin;
      zoomCurrentPercent=page.currentPercent;
      zoomBack=page.previous;
      zoomMore=page.next;
      const list=get('zoom-results');
      list.replaceChildren();
      for (const rule of page.rules) {
        const row=document.createElement('li'), description=document.createElement('div'), origin=document.createElement('code');
        const percent=document.createElement('p'), editButton=document.createElement('button'), reset=document.createElement('button');
        origin.className='origin';
        origin.textContent=rule.origin;
        percent.className='policy';
        percent.textContent=rule.percent+'%';
        editButton.textContent='编辑';
        editButton.setAttribute('aria-label','编辑 '+rule.origin+' 的缩放比例');
        editButton.onclick=()=>{
          if (zoomBusy) return;
          zoomInput.value=rule.origin;
          zoomPercent.value=rule.percent;
          zoomPercent.focus();
        };
        reset.textContent='恢复 100%';
        reset.setAttribute('aria-label','将 '+rule.origin+' 恢复为 100%');
        reset.onclick=()=>saveZoom(rule.origin,100,false);
        description.append(origin,percent);
        row.append(description,editButton,reset);
        list.append(row);
      }
      get('zoom').hidden=false;
      renderZoomControls();
    } catch (error) {
      if (revision!==zoomRevision) return;
      get('zoom').hidden=error.message==='PERMISSION_DENIED';
      zoomStatus.textContent='暂时无法读取网站缩放。';
      renderZoomControls();
    }
  }
  async function saveZoom(origin,percent,fromForm) {
    if (zoomBusy) return;
    zoomBusy=true;
    renderZoomControls();
    try {
      const applied=await host('siteSettings.zoom.set',{origin,percent});
      if (fromForm || zoomInput.value===applied.origin) {
        zoomInput.value=applied.origin;
        zoomPercent.value=applied.percent;
      }
      await refreshZoom(0);
      await refreshOverview();
      zoomStatus.textContent=percent===100?'已恢复 100%。':'已保存并应用 '+percent+'%。';
    } catch (error) {
      zoomStatus.textContent=messages[error.message] || '暂时无法保存网站缩放。';
    } finally { zoomBusy=false; renderZoomControls(); }
  }
  get('zoom-form').onsubmit=event=>{ event.preventDefault(); saveZoom(zoomInput.value.trim(),Number(zoomPercent.value),true); };
  zoomSearch.oninput=()=>{
    clearTimeout(zoomDebounce);
    zoomDebounce=setTimeout(()=>refreshZoom(0),140);
  };
  zoomPrev.onclick=()=>{ if (zoomBack!==null) refreshZoom(zoomBack); };
  zoomNext.onclick=()=>{ if (zoomMore!==null) refreshZoom(zoomMore); };
  function load() {
    refresh().catch(error => { status.textContent = messages[error.message] || '暂时无法读取网站设置。'; });
    refreshAutoplay().catch(() => { get('autoplay').hidden = true; });
    refreshSound().catch(() => { get('sound').hidden = true; });
    refreshNotifications();
    refreshZoom(0);
    refreshOverview();
  }
  document.addEventListener('visibilitychange',() => { if (!document.hidden) load(); });
  load();
</script>
</html>
