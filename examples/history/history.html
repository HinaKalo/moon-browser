<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>历史记录</title>
<style>
  :root {
    color-scheme: light;
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #14161b;
    --quiet: #5b6270;
    --line: #e3e6eb;
    --hover: #f1f3f6;
    --accent: #5b4df0;
    --destructive: #dc2626;
    background: var(--bg);
    color: var(--text);
  }
  :root[data-moon-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0f13;
    --surface: #181a20;
    --text: #eceef3;
    --quiet: #9aa0ae;
    --line: #262932;
    --hover: #20232b;
    --accent: #7c6cff;
    --destructive: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { width: min(100%, 900px); padding: 44px clamp(20px, 5vw, 48px) 56px; margin: auto; }
  h1 { font-size: 29px; letter-spacing: -.02em; margin: 0 0 22px; }
  h2 { font-size: 14px; font-weight: 600; margin: 22px 0 8px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
  input, select, button { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  input[type=search] { min-width: 170px; flex: 1; padding: 9px 12px; }
  select { padding: 8px 10px; }
  button { padding: 8px 13px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .views { display: flex; gap: 4px; margin-bottom: 14px; width: fit-content; padding: 3px; border: 1px solid var(--line); border-radius: 10px; }
  .views button { border-color: transparent; background: transparent; padding: 5px 12px; }
  .views button[aria-pressed=true] { background: var(--surface); border-color: var(--line); color: var(--accent); font-weight: 600; }
  #status, #feedback, #selection-count { color: var(--quiet); }
  #status:empty, #feedback:empty, #selection-count:empty { display: none; }
  #selection { align-items: center; margin-top: 12px; }
  #selection[hidden] { display: none; }
  #remove-selected { color: var(--destructive); }
  ul { padding: 0; margin: 0; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  li { min-width: 0; display: flex; align-items: center; gap: 8px; }
  li + li { border-top: 1px solid var(--line); }
  li input { flex: none; margin: 0 0 0 13px; width: 17px; height: 17px; accent-color: var(--accent); }
  a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-width: 0; flex: 1; color: inherit; text-decoration: none; border-radius: 8px; }
  a:hover { background: var(--hover); }
  .time { color: var(--quiet); font-variant-numeric: tabular-nums; flex: none; }
  .details { min-width: 0; }
  .details strong, .details small { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .details strong { font-weight: 600; }
  .details small { color: var(--quiet); }
  li button { border-color: transparent; margin-right: 7px; color: var(--quiet); }
  #more { margin-top: 16px; }
  .site-heading { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  [hidden] { display: none !important; }
  .site-heading h2 { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  #site-results { margin-top: 16px; }
  .site-row { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px; margin: 0; border: 0; text-align: left; color: var(--text); }
  .site-row .details { flex: 1; }
  .site-row small, .site-arrow { color: var(--quiet); }
  dialog { color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: min(400px, 90%); padding: 20px; }
  dialog::backdrop { background: #161a3360; }
  dialog h2 { margin-top: 0; font-size: 18px; }
  dialog p { color: var(--quiet); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
  #confirm { color: var(--destructive); }
</style>
<main>
  <h1>历史记录</h1>
  <div class="views" role="group" aria-label="浏览历史视图">
    <button type="button" id="by-date" aria-pressed="true">按日期</button>
    <button type="button" id="by-site" aria-pressed="false">按网站</button>
  </div>
  <div class="toolbar">
    <input id="query" type="search" placeholder="搜索标题或网址" aria-label="搜索历史记录" maxlength="64" autocomplete="off">
    <select id="range" aria-label="访问时间">
      <option value="all">全部时间</option>
      <option value="today">今天</option>
      <option value="yesterday">昨天</option>
      <option value="week">最近 7 天</option>
    </select>
    <button id="clear" disabled>清空记录</button>
    <button id="clear-range" type="button" hidden disabled>清除所选时段…</button>
  </div>
  <div class="site-heading" id="site-heading" hidden>
    <button type="button" id="site-back">返回网站列表</button>
    <h2 id="site-name" tabindex="-1"></h2>
  </div>
  <div class="toolbar" id="selection" hidden>
    <button type="button" id="select-displayed">选择已显示记录</button>
    <button type="button" id="remove-selected" disabled>移除所选…</button>
    <span id="selection-count" role="status"></span>
  </div>
  <p id="status" role="status">正在读取历史记录…</p>
  <p id="feedback" role="status"></p>
  <div id="results"></div>
  <ul id="site-results" aria-label="访问过的网站" hidden></ul>
  <button id="more" hidden>加载更多</button>
  <dialog id="confirm-clear" aria-labelledby="confirm-title">
    <h2 id="confirm-title">清空浏览历史？</h2>
    <p id="confirm-detail">此操作将移除当前浏览器配置文件中的所有浏览历史。</p>
    <div class="dialog-actions">
      <button id="cancel" autofocus>取消</button>
      <button id="confirm">清空记录</button>
    </div>
  </dialog>
</main>
<script>
  const query = document.getElementById('query');
  const results = document.getElementById('results');
  const status = document.getElementById('status');
  const more = document.getElementById('more');
  const clear = document.getElementById('clear');
  const clearRange = document.getElementById('clear-range');
  const confirm = document.getElementById('confirm-clear');
  const confirmButton = document.getElementById('confirm');
  const cancelButton = document.getElementById('cancel');
  const rangeInput = document.getElementById('range');
  const selection = document.getElementById('selection');
  const selectDisplayed = document.getElementById('select-displayed');
  const removeSelected = document.getElementById('remove-selected');
  const selectionCount = document.getElementById('selection-count');
  const feedback = document.getElementById('feedback');
  const byDateButton = document.getElementById('by-date');
  const bySiteButton = document.getElementById('by-site');
  const siteResults = document.getElementById('site-results');
  const siteHeading = document.getElementById('site-heading');
  const siteName = document.getElementById('site-name');
  const selectionLimit = 100;
  const selected = new Set();
  const dateFormat = new Intl.DateTimeFormat('zh-CN', { dateStyle: 'long' });
  const timeFormat = new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  let sequence = 0;
  let lastGroup;
  let cursor = null;
  let searchTimer;
  let range = {};
  let removal = null;
  let loading = false;
  let bySite = false;
  let currentSite = null;
  let sitesThrough = null;
  let siteOverview = null;

  async function host(method, params = {}) {
    const id = 'history:' + ++sequence;
    const message = await window.webkit.messageHandlers.moonHost.postMessage(JSON.stringify({ jsonrpc: '2.0', id, method, params }));
    const reply = JSON.parse(message);
    if (reply.id !== id) throw new Error('INVALID_RESPONSE');
    if (reply.error) throw new Error(reply.error.message);
    return reply.result;
  }

  function timeRange() {
    if (rangeInput.value === 'all') return {};
    const now = new Date();
    const midnight = days => new Date(now.getFullYear(), now.getMonth(), now.getDate() + days).getTime();
    if (rangeInput.value === 'yesterday') return { from: midnight(-1), until: midnight(0) };
    return { from: midnight(rangeInput.value === 'week' ? -6 : 0), until: midnight(1) };
  }

  function updateSelection() {
    const choices = results.hidden ? [] : results.querySelectorAll('input[data-visit]');
    selection.hidden = choices.length === 0;
    selectDisplayed.textContent = selected.size ? '取消选择' : '选择已显示记录';
    selectDisplayed.disabled = loading;
    removeSelected.disabled = loading || selected.size === 0;
    selectionCount.textContent = selected.size ? `已选择 ${selected.size} 条` +
      (selected.size === selectionLimit ? '，已达上限' : '') : '';
    for (const choice of choices) {
      choice.checked = selected.has(Number(choice.dataset.visit));
      choice.disabled = loading || (!choice.checked && selected.size === selectionLimit);
    }
  }

  function renderView() {
    byDateButton.setAttribute('aria-pressed', String(!bySite));
    bySiteButton.setAttribute('aria-pressed', String(bySite));
    results.hidden = bySite && !currentSite;
    siteResults.hidden = !results.hidden;
    siteHeading.hidden = !currentSite;
    siteName.textContent = currentSite || '';
  }

  function appendSite(site) {
    const row = document.createElement('li');
    const open = document.createElement('button');
    open.type = 'button';
    open.className = 'site-row';
    open.dataset.origin = site.origin;
    const details = document.createElement('span');
    details.className = 'details';
    const origin = document.createElement('strong');
    origin.textContent = site.origin;
    origin.title = site.origin;
    const summary = document.createElement('small');
    const recent = new Date(site.lastVisitedAt);
    summary.textContent = site.visits + ' 次访问 · 最近 ' + dateFormat.format(recent) + ' ' + timeFormat.format(recent);
    details.append(origin, summary);
    const arrow = document.createElement('span');
    arrow.className = 'site-arrow';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '›';
    open.append(details, arrow);
    open.onclick = async () => {
      currentSite = site.origin;
      results.replaceChildren();
      renderView();
      await load();
      if (currentSite === site.origin) siteName.focus();
    };
    row.append(open);
    siteResults.append(row);
  }

  function append(visit) {
    const date = new Date(visit.visitedAt);
    const label = dateFormat.format(date);
    if (!lastGroup || lastGroup.label !== label) {
      const heading = document.createElement('h2');
      heading.textContent = label;
      const list = document.createElement('ul');
      list.setAttribute('aria-label', label);
      results.append(heading, list);
      lastGroup = { label, list };
    }
    const item = document.createElement('li');
    item.dataset.visit = visit.id;
    const link = document.createElement('a');
    link.href = visit.url;
    const time = document.createElement('time');
    time.className = 'time';
    time.dateTime = date.toISOString();
    time.textContent = timeFormat.format(date);
    const details = document.createElement('span');
    details.className = 'details';
    const title = document.createElement('strong');
    title.textContent = visit.title || visit.url;
    const url = document.createElement('small');
    url.textContent = visit.url;
    details.append(title, url);
    link.append(time, details);
    const choice = document.createElement('input');
    choice.type = 'checkbox';
    choice.dataset.visit = visit.id;
    choice.setAttribute('aria-label', '选择 ' + title.textContent + ' ' + time.textContent);
    choice.onchange = () => {
      if (choice.checked && selected.size < selectionLimit) selected.add(visit.id);
      else selected.delete(visit.id);
      updateSelection();
    };
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '移除';
    remove.setAttribute('aria-label', '移除 ' + title.textContent);
    remove.onclick = async () => {
      remove.disabled = true;
      try {
        await host('history.remove', { id: visit.id });
        siteOverview = null;
        const following = item.nextElementSibling?.dataset.visit;
        await load();
        (results.querySelector('li[data-visit="' + following + '"] a') ?? query).focus();
      } catch {
        remove.disabled = false;
        status.textContent = '无法移除此记录。';
      }
    };
    item.append(choice, link, remove);
    lastGroup.list.append(item);
  }

  let loadVersion = 0;
  async function load(appendMore = false) {
    const version = ++loadVersion;
    const showSites = bySite && !currentSite;
    const list = showSites ? siteResults : results;
    loading = true;
    showClearAction();
    list.setAttribute('aria-busy', 'true');
    if (!appendMore) selected.clear();
    updateSelection();
    more.disabled = true;
    try {
      const text = query.value.trim();
      if (!appendMore) range = timeRange();
      const page = showSites ?
        await host('history.sites', { query: text, cursor: appendMore ? cursor : null, ...range }) :
        await host('history.list', {
          query: text, before: appendMore ? cursor : null, origin: currentSite, through: currentSite ? sitesThrough : null, ...range
        });
      if (version !== loadVersion) return;
      if (!appendMore) {
        list.replaceChildren();
        lastGroup = null;
      }
      if (showSites) {
        sitesThrough = page.through;
        page.sites.forEach(appendSite);
        siteOverview = { filter: JSON.stringify([text, range]), cursor: page.next, through: page.through };
      } else {
        page.visits.forEach(append);
      }
      cursor = page.next;
      more.hidden = cursor === null;
      if (list.children.length) status.textContent = '';
      else status.textContent = text || currentSite || rangeInput.value !== 'all' ? '没有匹配的浏览记录。' : '浏览过的网页会显示在这里。';
      if (!appendMore && !text && !currentSite && rangeInput.value === 'all') clear.disabled = list.children.length === 0;
      clearRange.disabled = false;
    } catch (error) {
      if (version !== loadVersion) return;
      clear.disabled = clearRange.disabled = true;
      more.hidden = true;
      list.replaceChildren();
      if (showSites) siteOverview = null;
      selected.clear();
      status.textContent = error.message === 'PERMISSION_DENIED' ? '请在插件菜单允许管理浏览历史。' : '无法读取历史记录。';
    } finally {
      if (version === loadVersion || list.hidden) list.removeAttribute('aria-busy');
      if (version === loadVersion) {
        loading = false;
        more.disabled = false;
        updateSelection();
      }
    }
  }
  async function changeView(sites) {
    const previousSite = currentSite;
    if (bySite === sites && !currentSite) return;
    const restore = sites && previousSite && siteOverview?.filter === JSON.stringify([query.value.trim(), timeRange()]);
    bySite = sites;
    currentSite = null;
    results.replaceChildren();
    status.textContent = '';
    feedback.textContent = '';
    clearTimeout(searchTimer);
    renderView();
    if (restore) {
      ++loadVersion;
      loading = false;
      selected.clear();
      cursor = siteOverview.cursor;
      sitesThrough = siteOverview.through;
      more.hidden = cursor === null;
      more.disabled = false;
      updateSelection();
    } else {
      siteResults.replaceChildren();
      siteOverview = sitesThrough = null;
      await load();
    }
    if (sites && previousSite && !currentSite) {
      const previous = [...siteResults.querySelectorAll('button')].find(item => item.dataset.origin === previousSite);
      (previous ?? bySiteButton).focus();
    }
  }
  byDateButton.onclick = () => changeView(false);
  bySiteButton.onclick = () => changeView(true);
  document.getElementById('site-back').onclick = () => changeView(true);
  query.addEventListener('input', () => {
    feedback.textContent = '';
    selected.clear();
    updateSelection();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => load(), 120);
  });
  function showClearAction() {
    clear.hidden = rangeInput.value !== 'all';
    clearRange.hidden = !clear.hidden;
  }
  rangeInput.onchange = () => {
    feedback.textContent = '';
    clearTimeout(searchTimer);
    load();
  };
  selectDisplayed.onclick = () => {
    if (selected.size) selected.clear();
    else {
      const choices = Array.from(results.querySelectorAll('input[data-visit]')).slice(0, selectionLimit);
      choices.forEach(choice => selected.add(Number(choice.dataset.visit)));
    }
    updateSelection();
  };
  more.onclick = () => load(true);
  function confirmRemoval({ids, period} = {}) {
    removal = {ids, period};
    const title = document.getElementById('confirm-title');
    const details = document.getElementById('confirm-detail');
    if (period) {
      title.textContent = '清除所选时段的浏览历史？';
      details.textContent = `将移除 ${dateFormat.format(period.from)} 至 ${dateFormat.format(period.until - 1)} 的全部访问记录。当前搜索和网站筛选不限制清除范围。`;
    } else {
      title.textContent = ids ? `移除选中的 ${ids.length} 条记录？` : '清空浏览历史？';
      details.textContent = ids ? '其他浏览记录会保留。' : '此操作将移除当前浏览器配置文件中的所有浏览历史。';
    }
    confirmButton.textContent = ids ? '移除记录' : period ? '清除该时段' : '清空记录';
    confirm.showModal();
  }
  clear.onclick = () => confirmRemoval();
  clearRange.onclick = () => {
    const period = timeRange();
    if (period.from !== undefined) confirmRemoval({period});
  };
  removeSelected.onclick = () => { if (selected.size) confirmRemoval({ids:[...selected]}); };
  cancelButton.onclick = () => confirm.close();
  confirm.oncancel = event => { if (confirmButton.disabled) event.preventDefault(); };
  confirmButton.onclick = async () => {
    confirmButton.disabled = cancelButton.disabled = true;
    feedback.textContent = '';
    try {
      const {ids, period} = removal;
      if (ids || period) {
        const { removed } = ids ? await host('history.removeMany', {ids}) : await host('history.clearRange', period);
        siteOverview = sitesThrough = null;
        feedback.textContent = removed ? `已移除 ${removed} 条记录。` : period ? '所选时段没有浏览记录。' : '所选记录已不存在。';
      } else {
        await host('history.clear');
        query.value = '';
        rangeInput.value = 'all';
        currentSite = null;
        sitesThrough = null;
        siteOverview = null;
        renderView();
      }
      confirm.close();
      await load();
      query.focus();
    } catch {
      confirm.close();
      feedback.textContent = '无法移除浏览记录。';
    } finally { confirmButton.disabled = cancelButton.disabled = false; }
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  load();
</script>
</html>
